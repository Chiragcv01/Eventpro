A.pickInv = () => formModal({ title: 'Add from godown', fields: [{ name: 'id', label: 'Item', type: 'select', full: true, options: col('inventory').map(i => [i.id, `${i.name} (${inr(i.rate)}/day)`]) }, { name: 'qty', label: 'Qty', type: 'number', min: 1, value: 1 }, { name: 'days', label: 'Days', type: 'number', min: 1, value: 1 }], submit: 'Add line', onSubmit: v => { const i = getById('inventory', v.id); S.draft.lines.push({ id: uid('l'), desc: i.name, qty: +v.qty, days: +v.days, rate: +i.rate, hsn: settings().sac }); S.dirty = true; setTimeout(render); } });
A.saveInv = async () => { try { const d = S.draft; d.lines = d.lines.filter(l => l.desc || l.rate); await save('invoices', JSON.parse(JSON.stringify(d)), `Saved ${d.no} (${inr(invCalc(d).total)})`); S.dirty = false; toast('Saved ' + d.no); render(); } catch (err) { toast(err.message, 'bad'); } };

A.convertQuote = async () => {
  try { const q = S.draft; await A.saveInv(); const e = q.eventId ? evById(q.eventId) : null;

A.delInv = id => { const i = getById('invoices', id); confirmBox('Delete ' + i.no + '?', 'Payments linked to it stay in Payments but lose the link.', 'Delete', async () => { await removeRec('invoices', id, 'Deleted ' + i.no); S.draft = null; S.dirty = false; A.go('invoices'); }); };
function invShareText(d) { const c = invCalc(d); const st = settings(); return `Namaste ${d.client || ''} ji,\n${d.type === 'quotation' ? 'Quotation' : 'Invoice'} ${d.no} from ${st.bizName}\nTotal: ${inr(c.total)}${d.gstMode === 'excl' ? ' (incl. GST)' : ''}${d.type === 'invoice' ? `\nReceived: ${inr(c.paid)}\nBalance: ${inr(Math.max(0, c.balance))}` : ''}${st.upi ? `\nUPI: ${st.upi}` : ''}\nDhanyawad!`; }

  <table style="margin-top:8px;max-width:340px;margin-left:auto" class="tot"><tbody><tr><td>Subtotal</td><td class="r">${inr(c.sub)}</td></tr>${c.disc ? `<tr><td>Discount</td><td class="r">− ${inr(c.disc)}</td></tr>` : ''}${d.gstMode !== 'none' ? `<tr><td>Taxable value</td><td class="r">${inr(c.taxable)}</td></tr>${d.interstate ? `<tr><td>IGST @ ${r}%</td><td class="r">${inr(c.igst)}</td></tr>` : `<tr><td>CGST @ ${r / 2}%</td><td class="r">${inr(c.cgst)}</td></tr><tr><td>SGST @ ${r / 2}%</td><td class="r">${inr(c.sgst)}</td></tr>`}` : ''}<tr class="grand"><td>Grand total</td><td class="r">${inr(c.total)}</td></tr>${d.type === 'invoice' && c.paid ? `<tr><td>Received</td><td class="r">${inr(c.paid)}</td></tr><tr><td><b>Balance due</b></td><td class="r"><b>${inr(Math.max(0, c.balance))}</b></td></tr>` : ''}</tbody></table></div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px;font-size:12px"><div><b>Terms</b><div class="pm" style="white-space:pre-line">${esc(d.notes ? d.notes + '\n' : '')}${esc(st.terms || '')}</div></div>

A.previewInv = () => { const d = S.draft || getById('invoices', S.params.id); modal(`${sheetHead('Preview', d.no)}<div class="sheet-b"><div id="printArea">${invoicePaper(d)}</div></div><footer class="sheet-f no-print">${waBtn(invShareText(d), d.phone, 'Send on WhatsApp')}<span class="grow"></span>${!FRAMED ? `<button class="btn primary" onclick="window.print()">${ic('print')} Print / Save PDF</button>` : `<span class="tiny muted">Print and PDF work on your deployed site.</span>`}</footer>`, { wide: true }); };

/* ================= Payments ================= */
function payRow(p) { const inv = getById('invoices', p.invoiceId); return `<div class="row click" onclick="A.receipt('${p.id}')">${ibox(p.mode === 'Cash' ? 'wallet' : 'rupee', '#0B9B68')}<div class="main-col"><b class="num">${inr(p.amount)}</b><div class="sub">${fmtShort(p.date)} · ${esc(p.mode)}${p.ref ? ' · ' + esc(p.ref) : ''}${inv ? ' · ' + esc(inv.no) : ''}</div></div>${pill(inv?.client || evById(p.eventId)?.client || 'Advance', 'good')}</div>`; }
V.payments = () => {
  const tab = S.params.tab || 'due';
  const pays = col('payments').slice().sort((a, b) => b.date.localeCompare(a.date));
  const ms = todayLocal().slice(0, 8) + '01';
  const dueList = col('invoices').filter(i => i.type === 'invoice').map(i => ({ i, c: invCalc(i) })).filter(x => x.c.balance > 0).sort((a, b) => (a.i.dueDate || '').localeCompare(b.i.dueDate || ''));
  const aging = [[0, 0], [1, 30], [31, 60], [61, 9999]].map(([a, b]) => sum(dueList.filter(x => { const d = x.i.dueDate ? daysBetween(x.i.dueDate, todayLocal()) : 0; return a === 0 ? d <= 0 : d >= a && d <= b; }), x => x.c.balance));
  return pageHead('Payments', 'Collections, receipts and polite taqaza reminders.', can('payments', 2) ? `<button class="btn primary" onclick="A.paymentForm()">${ic('plus')} Record payment</button>` : '') +

  ${tab === 'due' ? `<div class="card"><div class="rows">${dueList.map(({ i, c }) => { const late = i.dueDate ? daysBetween(i.dueDate, todayLocal()) : 0; const st = settings();
    const msg = `Namaste ${i.client} ji 🙏\nGentle reminder from ${st.bizName}: ${inr(c.balance)} is pending against ${i.no}${i.dueDate ? ' (due ' + fmtDate(i.dueDate) + ')' : ''}.${st.upi ? `\nUPI: ${st.upi}` : ''}${st.account ? `\nBank: ${st.bank} A/c ${st.account} IFSC ${st.ifsc}` : ''}\nPlease share the payment screenshot once done. Dhanyawad!`;
    return `<div class="row">${ibox(late > 0 ? 'alert' : 'clock', late > 0 ? '#E0344B' : '#D97706')}<div class="main-col"><b>${esc(i.client)}</b><div class="sub"><span class="mono tiny">${esc(i.no)}</span><br>Total ${inr(c.total)} · paid ${inr(c.paid)}</div></div><div class="end stack-sm" style="align-items:flex-end;gap:6px"><b class="num" style="color:var(--bad)">${inr(c.balance)}</b>${late > 0 ? pill(late + ' days late', 'bad') : pill('Due ' + fmtShort(i.dueDate), 'warn')}<div class="row-flex" style="gap:4px">${waBtn(msg, i.phone, 'Taqaza')}${can('payments', 2) ? `<button class="btn sm" onclick="A.paymentForm('${i.id}')">Received</button>` : ''}</div></div></div>`; }).join('') || empty('No pending payments', 'Every invoice is fully paid. Shabaash!')}</div></div>`
    : `<div class="card"><div class="rows">${pays.map(payRow).join('') || empty('No payments yet', 'Record advances and balances as they come in.')}</div></div>`}`;
};
A.paymentForm = (invoiceId, evId) => {

A.receipt = id => {

/* ================= Staff, attendance, payroll ================= */
V.staff = () => {
  const tab = S.params.tab || 'roster'; const edit = can('staff', 2); const seeRates = can('reports') || edit;
  const head = pageHead('Staff & wages', 'Crew roster, duty hours, overtime, attendance by event, advances, kharcha and monthly payout.', edit ? `${importBtn('staff')}<button class="btn" onclick="A.crewMoneyForm()">${ic('rupee')} Crew money</button><button class="btn primary" onclick="A.staffForm()">${ic('plus')} Add crew</button>` : '');
  const tabs = `<div class="tabs">${[['roster', 'Roster'], ['attendance', 'Attendance'], ['money', 'Crew money'], ['payroll', 'Payroll']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="A.setP('tab','${k}')">${l}</button>`).join('')}${tabHelp('staff-' + tab)}</div>`;
  if (tab === 'attendance') {
    const date = S.filters.attDate || todayLocal(); const evs = col('events').filter(e => e.date <= addDays(date, 1) && eventEnd(e) >= addDays(date, -1) && e.stage !== 'Cancelled');
    const rows = col('staff').map(s => { const a = getById('attendance', date + '_' + s.id) || {}; const p = attPay(a.status ? a : null, s);
      const extra = a.status === 'P' && (p.shifts > 1 || p.otHours) ? pill(`${p.shifts > 1 ? p.shifts + ' shifts' : '1 shift'}${p.otHours ? ' + ' + p.otHours + ' hrs overtime' : ''}`, 'accent') : '';
      return `<div class="row" style="flex-wrap:wrap"><div class="main-col" style="min-width:140px"><b>${esc(s.name)}</b><div class="sub">${esc(s.role || '')} · duty ${dutyHrs(s)} hrs</div>${extra ? `<div style="margin-top:4px">${extra}</div>` : ''}</div><div class="row-flex" style="gap:6px;justify-content:flex-end;flex-wrap:wrap">${edit ? `<select class="inline-in" style="width:auto;max-width:150px" onchange="A.mark('${s.id}','${date}',null,this.value)" aria-label="Event"><option value="">No event</option>${evs.map(e => `<option value="${e.id}" ${a.eventId === e.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select>` : ''}<div class="seg">${[['P', 'Present'], ['H', 'Half'], ['A', 'Absent']].map(([k, l]) => `<button class="${a.status === k ? 'on' : ''}" ${edit ? `onclick="A.mark('${s.id}','${date}','${k}')"` : 'disabled'} title="${l}">${k}</button>`).join('')}</div>${edit ? `<label class="hrs-in"><input class="inline-in" type="number" min="0" max="48" step="0.5" inputmode="decimal" value="${a.hours || ''}" placeholder="${dutyHrs(s)}" onchange="A.markHours('${s.id}','${date}',this.value)" aria-label="Hours worked"><span>hrs</span></label><button class="btn sm ghost" onclick="A.crewMoneyForm(null,'${s.id}','${a.eventId || ''}','${date}')" title="Give kharcha / advance">+ ₹</button>` : ''}</div></div>`; }).join('');
    const present = col('attendance').filter(a => a.date === date); const cnt = k => present.filter(a => a.status === k).length;
    return head + tabs + `<div class="toolbar"><input type="date" style="width:auto" value="${date}" onchange="A.setF('attDate',this.value)">${pill(cnt('P') + ' present', 'good')}${pill(cnt('H') + ' half day', 'warn')}${pill(cnt('A') + ' absent', 'bad')}${edit ? `<button class="btn sm" onclick="A.markAll('${date}')">Mark all present</button>` : ''}</div>
    <div class="banner" style="margin-bottom:12px">${ic('clock')}<span>Write the hours only when someone works more than their duty. Extra hours become overtime; a full extra duty becomes one more shift.</span></div>
    <div class="card"><div class="rows">${rows || empty('No crew added', 'Add your labour and staff first.')}</div></div>`;
  }
  if (tab === 'money') {
    const month = S.filters.cmMonth || todayLocal().slice(0, 7);
    const list = col('advances').filter(x => (x.date || '').startsWith(month)).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const byKind = k => sum(list.filter(x => smKind(x) === k), x => x.amount);
    return head + tabs + `<div class="toolbar"><input type="month" style="width:auto" value="${month}" onchange="A.setF('cmMonth',this.value)"></div>
    <div class="kpis">${kpi('Advance', inr(byKind('advance')), 'Cut from pay', '', 'rupee', '#EA580C')}${kpi('Food / khuraki', inr(byKind('food')), 'Company kharcha', '', 'pot', '#16A34A')}${kpi('Travel / other', inr(byKind('travel')), 'Company kharcha', '', 'truck', '#2563EB')}${kpi('Bonus', inr(byKind('bonus')), 'Added to pay', '', 'gift', '#DB2777')}</div>
    <div class="card"><div class="rows">${list.map(crewMoneyRow).join('') || empty('No crew money this month', 'Advances, food at the event, travel and bonus show here.')}</div></div>`;
  }
  if (tab === 'payroll') {
    const month = S.filters.payMonth || todayLocal().slice(0, 7);
    const rows = col('staff').map(s => { const pay = payrollOf(s, month); const paid = getById('payouts', month + '_' + s.id);
      return `<tr><td><b>${esc(s.name)}</b><div class="tiny muted">${inr(s.rate)}/duty · duty ${dutyHrs(s)} hrs · OT ${inr(otRateOf(s))}/hr</div>${pay.company ? `<div class="tiny muted">Kharcha (company) ${inr(pay.company)}</div>` : ''}</td><td class="r">${pay.shifts}</td><td class="r">${pay.otHours || '—'}</td><td class="r">${inr(pay.wage)}</td><td class="r">${pay.ot ? inr(pay.ot) : '—'}</td><td class="r">${pay.bonus ? '+ ' + inr(pay.bonus) : '—'}</td><td class="r" style="color:var(--bad)">${pay.adv ? '− ' + inr(pay.adv) : '—'}</td><td class="r"><b>${inr(pay.net)}</b></td><td class="r">${paid ? pill('Paid ' + fmtShort(paid.date), 'good') : edit ? `<button class="btn sm" onclick="A.payout('${s.id}','${month}',${pay.net})">Mark paid</button>` : pill('Pending', 'warn')}</td><td>${edit ? `<button class="btn sm ghost" onclick="A.crewMoneyForm(null,'${s.id}')">+ ₹</button>` : ''}</td></tr>`; }).join('');
    return head + tabs + `<div class="toolbar"><input type="month" style="width:auto" value="${month}" onchange="A.setF('payMonth',this.value)"><span class="small muted">Net pay = wages + overtime + bonus − advance. Food and travel kharcha is the company’s cost, not cut from pay.</span></div><div class="card"><div class="tbl-wrap"><table class="tbl payroll"><thead><tr><th>Crew</th><th class="r">Shifts</th><th class="r">OT hrs</th><th class="r">Wages</th><th class="r">Overtime</th><th class="r">Bonus</th><th class="r">Advance</th><th class="r">Net pay</th><th class="r">Status</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="10">${empty('No crew', '')}</td></tr>`}</tbody></table></div></div>`;
  }
  return head + tabs + `<div class="grid g-auto">${col('staff').map(s => { const linked = S.members.find(m => m.staffId === s.id); const month = todayLocal().slice(0, 7); const pay = payrollOf(s, month);
    return `<div class="card pad stack-sm"><div class="row-flex" style="flex-wrap:nowrap"><div class="avatar">${esc(initials(s.name))}</div><div style="min-width:0;flex:1"><b>${esc(s.name)}</b><div class="tiny muted">${esc(s.role || '')} · ${esc(s.phone || '')}</div></div></div><div class="row-flex small" style="justify-content:space-between"><span class="muted">${seeRates ? inr(s.rate) + '/duty · ' : ''}duty ${dutyHrs(s)} hrs · ${pay.shifts} shifts this month</span>${linked ? pill('App login', 'primary') : ''}</div><div class="row-flex">${s.phone ? waBtn('Namaste ' + s.name.split(' ')[0] + ' ji, ', s.phone, 'Message') : ''}${edit ? `<button class="btn sm" onclick="A.staffForm('${s.id}')">${ic('edit')} Edit</button><button class="btn sm ghost" onclick="A.crewMoneyForm(null,'${s.id}')">+ ₹</button>` : ''}</div></div>`; }).join('') || `<div class="card">${empty('No crew yet', 'Add riggers, halwai, waiters, DG techs and helpers.')}</div>`}</div>`;
};
function payrollOf(s, month) {
  const att = col('attendance').filter(a => a.staffId === s.id && (a.date || '').startsWith(month));
  const r = { shifts: 0, otHours: 0, wage: 0, ot: 0 }; att.forEach(a => { const p = attPay(a, s); r.shifts += p.shifts; r.otHours += p.otHours; r.wage += p.wage; r.ot += p.ot; });
  const money = col('advances').filter(a => a.staffId === s.id && (a.date || '').startsWith(month));
  const k = kind => sum(money.filter(x => smKind(x) === kind), x => x.amount);
  r.adv = k('advance'); r.bonus = k('bonus'); r.company = k('food') + k('travel');
  r.otHours = Math.round(r.otHours * 10) / 10; r.net = r.wage + r.ot + r.bonus - r.adv; return r;
}
function crewMoneyRow(x) {
  const s = getById('staff', x.staffId); const k = smKind(x); const [label, tone, icon, c] = { advance: ['Advance', 'warn', 'rupee', '#EA580C'], food: ['Food / khuraki', 'good', 'pot', '#16A34A'], travel: ['Travel / other', 'info', 'truck', '#2563EB'], bonus: ['Bonus', 'primary', 'gift', '#DB2777'] }[k];
  const ev = x.eventId ? evById(x.eventId) : null; const edit = can('staff', 2);

/* Every cost of the month in one list: expenses typed here + crew wages/overtime + crew kharcha + vendor POs.
   The crew and vendor lines are read from Staff and Vendors (never typed twice), so Reports and event profit match. */
function monthCosts(month) {
  const out = col('expenses').filter(x => (x.date || '').startsWith(month)).map(x => ({ src: 'exp', date: x.date, amount: +x.amount || 0, cat: x.category, x }));
  if (can('staff')) {
    col('staff').forEach(s => { const p = payrollOf(s, month); if (p.wage + p.ot > 0) out.push({ src: 'wage', date: month + '-' + String(new Date(+month.slice(0, 4), +month.slice(5, 7), 0).getDate()).padStart(2, '0'), amount: p.wage + p.ot, cat: 'Crew wages', s, p }); });
    col('advances').filter(x => smKind(x) !== 'advance' && (x.date || '').startsWith(month)).forEach(x => out.push({ src: 'crew', date: x.date, amount: +x.amount || 0, cat: 'Crew kharcha', x }));
  }
  if (can('vendors')) col('pos').filter(x => (x.date || '').startsWith(month)).forEach(x => out.push({ src: 'po', date: x.date, amount: +x.amount || 0, cat: 'Vendor POs', x }));
  return out.sort((a, b) => b.date.localeCompare(a.date));
}

}

/* ================= Reports ================= */
function periodRange(p) {
  const t = todayLocal(); const d = new Date(t + 'T00:00');
  if (p === 'month') return [t.slice(0, 8) + '01', t];
  if (p === 'last') { const s = todayLocal(new Date(d.getFullYear(), d.getMonth() - 1, 1)); const e = todayLocal(new Date(d.getFullYear(), d.getMonth(), 0)); return [s, e]; }
  if (p === 'fy') { const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return [`${y}-04-01`, `${y + 1}-03-31`]; }
  return ['0000-01-01', '9999-12-31'];
}
V.reports = () => {
  const p = S.filters.period || 'fy'; const [a, b] = periodRange(p); const inR = d => d && d >= a && d <= b;
  const invs = col('invoices').filter(i => i.type === 'invoice' && inR(i.date)); const billed = sum(invs, i => invCalc(i).total); const gst = sum(invs, i => invCalc(i).gst);
  const collected = sum(col('payments').filter(x => inR(x.date)), x => x.amount);
  const po = sum(col('pos').filter(x => inR(x.date)), x => x.amount); const exp = sum(col('expenses').filter(x => inR(x.date)), x => x.amount); const wages = wageCost(x => inR(x.date)); const crew = crewSpend(x => inR(x.date));
  const cost = po + exp + wages + crew; const net = billed - gst - cost;
  const months = []; const base = new Date(todayLocal() + 'T00:00'); for (let k = 5; k >= 0; k--) { const m = todayLocal(new Date(base.getFullYear(), base.getMonth() - k, 1)).slice(0, 7); months.push(m); }
  const mrev = months.map(m => sum(col('invoices').filter(i => i.type === 'invoice' && (i.date || '').startsWith(m)), i => invCalc(i).total));
  const mcost = months.map(m => sum(col('pos').filter(x => (x.date || '').startsWith(m)), x => x.amount) + sum(col('expenses').filter(x => x.date.startsWith(m)), x => x.amount) + wageCost(x => x.date.startsWith(m)) + crewSpend(x => (x.date || '').startsWith(m)));
  const evs = col('events').filter(e => inR(e.date) && e.stage !== 'Cancelled').map(e => ({ e, m: eventMoney(e) })).sort((x, y) => y.m.revenue - x.m.revenue);
  return pageHead('Reports & P&L', `${fmtDate(a === '0000-01-01' ? null : a)} to ${fmtDate(b === '9999-12-31' ? todayLocal() : b)}`, `${seg('period', [['month', 'This month'], ['last', 'Last month'], ['fy', 'This FY'], ['all', 'All time']], p, 'A.setF')}${!FRAMED ? `<button class="btn sm" onclick="A.dl('pnl.csv')">${ic('download')} CSV</button>` : ''}`) +
  `<div class="kpis">${kpi('Billed', inr(billed), `GST ${inr(gst)}`)}${kpi('Collected', inr(collected), '', 'good', 'rupee', '#0B9B68')}${kpi('Costs', inr(cost), `Vendors ${inr(po)} · Exp ${inr(exp)} · Crew ${inr(wages + crew)}`)}${kpi('Net profit (ex-GST)', inr(net), billed ? (net / (billed - gst) * 100).toFixed(1) + '% margin' : '', net >= 0 ? 'good' : 'bad')}</div>
  <div class="split"><div class="card pad"><div class="row-flex" style="justify-content:space-between;margin-bottom:8px"><h3>Last 6 months</h3><div class="legend"><span><i style="background:var(--primary)"></i>Billed</span><span><i style="background:var(--accent)"></i>Costs</span></div></div><div class="chart">${barChart(months, mrev, mcost)}</div></div>
  <div class="card pad stack-sm"><h3>Where the money goes</h3>${[['Vendor POs', po], ['Expenses', exp], ['Crew wages & overtime', wages], ['Crew kharcha & bonus', crew]].map(([l, v]) => `<div><div class="row-flex small" style="justify-content:space-between"><span>${l}</span><b class="num">${inr(v)}</b></div>${prog(cost ? v / cost * 100 : 0)}</div>`).join('')}</div></div>
  <div class="card" style="margin-top:14px"><div class="card-h"><h3>Profit by event</h3><span class="tiny muted">Revenue uses invoices, or package value until invoiced</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Event</th><th class="r">Revenue</th><th class="r">Costs</th><th class="r">Profit</th><th class="r">Margin</th></tr></thead><tbody>${evs.map(({ e, m }) => `<tr onclick="A.go('event',{id:'${e.id}',tab:'money'})" style="cursor:pointer"><td><b>${esc(e.title)}</b><div class="tiny muted">${fmtShort(e.date)} · ${num(e.pax)} pax</div></td><td class="r">${inr(m.revenue)}</td><td class="r">${inr(m.cost)}</td><td class="r" style="color:${m.profit >= 0 ? 'var(--good)' : 'var(--bad)'}"><b>${inr(m.profit)}</b></td><td class="r">${m.revenue ? m.margin.toFixed(1) + '%' : '—'}</td></tr>`).join('') || `<tr><td colspan="5">${empty('No events in this period', '')}</td></tr>`}</tbody></table></div></div>`;
};
A.dl = name => { const p = S.filters.period || 'fy'; const [a, b] = periodRange(p); const evs = col('events').filter(e => e.date >= a && e.date <= b && e.stage !== 'Cancelled'); downloadFile(name, 'Event,Date,Client,Revenue,Costs,Profit,Margin %\n' + evs.map(e => { const m = eventMoney(e); return `"${e.title}",${e.date},"${e.client}",${Math.round(m.revenue)},${Math.round(m.cost)},${Math.round(m.profit)},${m.margin.toFixed(1)}`; }).join('\n'), 'text/csv'); };
function barChart(labels, s1, s2) {
  const W = 560, H = 220, pl = 52, pb = 26, pt = 10; const max = Math.max(1, ...s1, ...s2); const nice = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / nice) * nice;
  const y = v => pt + (H - pt - pb) * (1 - v / top); const gw = (W - pl) / labels.length; const bw = Math.min(26, gw / 3);
  const fmt = v => v >= 1e7 ? (v / 1e7).toFixed(1) + 'Cr' : v >= 1e5 ? (v / 1e5).toFixed(1) + 'L' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : v;
  let g = ''; for (let k = 0; k <= 4; k++) { const v = top * k / 4; g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">₹${fmt(v)}</text>`; }
  labels.forEach((m, i) => { const x = pl + gw * i + gw / 2; g += `<rect x="${x - bw - 1}" y="${y(s1[i])}" width="${bw}" height="${H - pb - y(s1[i])}" rx="3" fill="var(--primary)"><title>Billed ${inr(s1[i])}</title></rect><rect x="${x + 1}" y="${y(s2[i])}" width="${bw}" height="${H - pb - y(s2[i])}" rx="3" fill="var(--accent)"><title>Costs ${inr(s2[i])}</title></rect><text x="${x}" y="${H - 8}" text-anchor="middle">${new Date(m + '-01T00:00').toLocaleDateString('en-IN', { month: 'short' })}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Billed vs costs, last six months">${g}</svg>`;
}

function seatingTool() {
  const f = S.seat = S.seat || { pax: 500, area: 12000, style: 'royal' };
  let tables, chairs, sofas; if (f.style === 'royal') { tables = Math.ceil(f.pax * .5 / 8); chairs = Math.ceil(f.pax * .85); sofas = Math.ceil(f.pax * .1 / 2); } else if (f.style === 'banquet') { tables = Math.ceil(f.pax / 8); chairs = f.pax; sofas = 10; } else { tables = 6; chairs = f.pax; sofas = 12; }
  const dens = f.pax ? f.area / f.pax : 0; const verdict = dens >= 20 ? ['Comfortable', 'good'] : dens >= 12 ? ['Tight but workable', 'warn'] : ['Too crowded', 'bad'];
  return `<div class="split"><div class="card pad stack"><div class="grid2" style="padding:0"><label class="field"><span>Guests</span><input type="number" min="1" value="${f.pax}" onchange="A.seat('pax',this.value)"></label><label class="field"><span>Area (sq ft)</span><input type="number" min="100" value="${f.area}" onchange="A.seat('area',this.value)"></label><label class="field full"><span>Setup style</span><select onchange="A.seat('style',this.value)"><option value="royal" ${f.style === 'royal' ? 'selected' : ''}>Wedding mix (50% dining, lounges)</option><option value="banquet" ${f.style === 'banquet' ? 'selected' : ''}>Full banquet (tables of 8)</option><option value="theatre" ${f.style === 'theatre' ? 'selected' : ''}>Theatre / conference rows</option></select></label></div>
  <div class="banner ${verdict[1]}">${ic('ruler')}<span><b>${dens.toFixed(1)} sq ft per guest</b> · ${verdict[0]}. Keep 20+ for weddings with buffet counters and a 6 ft fire exit corridor.</span></div></div>
  <div class="card pad stack"><h3>You need</h3><div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:0">${kpi('Round tables', tables)}${kpi('Chairs', chairs)}${kpi('VIP sofas', sofas)}</div>${can('inventory') ? `<div class="stack-sm small">${[['Round Table', tables], ['Chair', chairs], ['Sofa', sofas]].map(([k, n]) => { const it = col('inventory').find(i => i.name.toLowerCase().includes(k.toLowerCase())); return it ? `<div class="row-flex" style="justify-content:space-between"><span>${esc(it.name)}</span><span class="num">${num(n)} needed · ${num(availableOn(it, todayLocal()))} free today</span></div>` : ''; }).join('')}</div>` : ''}</div></div>`;
}
A.seat = (k, v) => { S.seat[k] = k === 'style' ? v : Math.max(1, +v || 1); render(); };
function truckTool() {
  const evs = col('events').filter(e => (e.items || []).length && !['Cancelled', 'Closed'].includes(e.stage)).sort(by('date'));
  const evId = S.filters.truckEv || evs[0]?.id; const e = evById(evId); const cap = +(S.filters.truckCap || 4000);
  const order = ['Tents & Shamiana', 'Power & DG', 'Decor & Flooring', 'Furniture', 'Catering Utensils', 'Lighting & Sound', 'Other'];
  const rows = (e?.items || []).map(it => ({ it, item: getById('inventory', it.invId) })).filter(x => x.item).map(x => ({ ...x, w: (+x.item.weightKg || 0) * x.it.qty })).sort((a, b) => order.indexOf(a.item.category) - order.indexOf(b.item.category));
  const total = sum(rows, r => r.w); const trips = Math.max(1, Math.ceil(total / cap)); const pct = Math.min(100, total / cap * 100);
  const msg = e ? `Loading list: ${e.title} → ${e.venue}\nTotal ~${num(total)} kg (${trips} trip${trips > 1 ? 's' : ''})\nLoad heavy first:\n` + rows.map((r, i) => `${i + 1}. ${r.item.name} × ${r.it.qty} (~${num(r.w)} kg)`).join('\n') : '';
  return `<div class="split"><div class="card pad stack"><label class="field"><span>Booking</span><select onchange="A.setF('truckEv',this.value)">${evs.map(x => `<option value="${x.id}" ${x.id === evId ? 'selected' : ''}>${esc(x.title)} (${fmtShort(x.date)})</option>`).join('') || '<option>No bookings with items</option>'}</select></label><label class="field"><span>Vehicle</span><select onchange="A.setF('truckCap',this.value)">${VEHICLES.map(([n, c]) => `<option value="${c}" ${c === cap ? 'selected' : ''}>${n} · ${num(c)} kg</option>`).join('')}</select></label>
  <div><div class="row-flex" style="justify-content:space-between"><b>Load</b><b class="num">${num(total)} / ${num(cap)} kg</b></div>${prog(pct)}<p class="small" style="margin-top:6px;color:${total > cap ? 'var(--bad)' : 'var(--good)'}">${total > cap ? `Over capacity: plan ${trips} trips or a bigger vehicle to avoid overloading fines.` : 'Within capacity for one trip.'}</p></div>${e ? waBtn(msg, '', 'Send to driver') : ''}</div>
  <div class="card"><div class="card-h"><h3>Loading order</h3><span class="tiny muted">Heavy base first, delicate lights last</span></div><div class="rows">${rows.map((r, i) => `<div class="row"><span class="pill ${i < 2 ? 'primary' : ''} num">${i + 1}</span><div class="main-col"><b>${esc(r.item.name)} × ${num(r.it.qty)}</b><div class="sub">${esc(r.item.category)}</div></div><span class="num small">${r.w ? '~' + num(r.w) + ' kg' : 'set weight in inventory'}</span></div>`).join('') || empty('Nothing to load', 'Reserve items in a booking first.')}</div></div></div>`;
}

  const n = Object.values(b.data).reduce((s, a) => s + (Array.isArray(a) ? a.length : 0), 0);

A.uploadImg = (kind, file) => {
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Choose an image file (PNG or JPG)', 'bad'); return; }
  if (file.size > 5e6) { toast('This image is over 5 MB. Choose a smaller one.', 'bad'); return; }
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const max = kind === 'logo' ? 360 : 480; const w = img.naturalWidth || 300, h = img.naturalHeight || 300; const k = Math.min(1, max / Math.max(w, h));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/png'); if (url.length > 260000) url = c.toDataURL('image/jpeg', .85);
      try { await saveSettingsRec({ [kind]: url }); logAct(kind === 'logo' ? 'Updated business logo' : 'Updated stamp / signature'); toast(kind === 'logo' ? 'Logo saved. It now shows on all bills.' : 'Stamp saved'); render(); } catch (e) { toast(e.message, 'bad'); }
    };
    img.onerror = () => toast('Could not read this image. Try a PNG or JPG.', 'bad');
    img.src = r.result;
  };
  r.readAsDataURL(file);
};
A.removeImg = async kind => { try { await saveSettingsRec({ [kind]: '' }); render(); } catch (e) { toast(e.message, 'bad'); } };

async function shrinkImage(file, max = 1600) {
  if (!/^image\//.test(file?.type || '')) throw new Error('Choose an image file (PNG or JPG)');
  if (file.size > 15e6) throw new Error('This image is over 15 MB. Choose a smaller one.');
  if (file.type === 'image/gif') { if (file.size > 3e6) throw new Error('GIF must be under 3 MB'); return { blob: file, ext: 'gif' }; }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read this image. Try a PNG or JPG.')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .84));
    return { blob, ext: 'jpg' };
  } finally { URL.revokeObjectURL(url); }
}

/* Only safe formatting survives: headings, paragraphs, lists, links, pictures. */
function cleanHTML(html) {
  const ALLOW = { P: [], H2: [], H3: [], H4: [], STRONG: [], B: [], EM: [], I: [], U: [], UL: [], OL: [], LI: [], BLOCKQUOTE: [], A: ['href'], IMG: ['src', 'alt'], BR: [], HR: [], FIGURE: [], FIGCAPTION: [] };
  const DROP = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH', 'TEMPLATE', 'FORM', 'INPUT', 'BUTTON', 'SELECT', 'TEXTAREA', 'META', 'LINK', 'TITLE', 'HEAD', 'NOSCRIPT', 'VIDEO', 'AUDIO', 'CANVAS']);
  const doc = new DOMParser().parseFromString('<body><div id="r">' + String(html || '') + '</div></body>', 'text/html');
  const root = doc.getElementById('r');
  const walk = n => {
    for (const c of [...n.childNodes]) walk(c);
    if (n === root || n.nodeType === 3) return;
    if (n.nodeType !== 1) { n.remove(); return; }
    let tag = n.tagName.toUpperCase();
    if (DROP.has(tag)) { n.remove(); return; }
    if (tag === 'H1') tag = 'H2';
    if (tag === 'DIV' || tag === 'SECTION' || tag === 'ARTICLE' || tag !== n.tagName.toUpperCase()) { const x = doc.createElement(tag === 'H2' ? 'h2' : 'p'); while (n.firstChild) x.appendChild(n.firstChild); n.replaceWith(x); return; }
    if (!ALLOW[tag]) { n.replaceWith(...n.childNodes); return; }
    for (const a of [...n.attributes]) if (!ALLOW[tag].includes(a.name.toLowerCase())) n.removeAttribute(a.name);
    if (tag === 'A') { const h = (n.getAttribute('href') || '').trim(); if (!/^(https?:\/\/|mailto:|tel:|\/(?!\/))/i.test(h)) n.removeAttribute('href'); }
    if (tag === 'IMG') { const s = (n.getAttribute('src') || '').trim(); if (!/^(https:\/\/|\/(?!\/)|data:image\/(png|jpe?g|webp|gif);base64,)/i.test(s)) n.remove(); }
  };
  walk(root);
  return root.innerHTML.replace(/<p>(\s|&nbsp;|<br>)*<\/p>/g, '').trim();
}

/* One screen imports stock, menu, crew, vendors or bookings from a sheet.
   Columns are matched by heading (English or Hindi), so the owner's own sheet often works as it is. */
const XLSX_SRC = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
const normH = s => String(s || '').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]/g, '');
const toNum = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/[₹,\s]/g, '')); return isFinite(n) ? n : NaN; };
const yes = v => /^(y|yes|haan|ha|han|true|1|हां|हाँ|✓|✔)$/i.test(String(v || '').trim());
const pickFrom = (list, v, fallback) => { const k = normH(v); if (!k) return fallback; return list.find(x => normH(x) === k) || list.find(x => normH(x).includes(k) || k.includes(normH(x))) || fallback; };
function toDate(v) {
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return todayLocal(new Date(v.getTime() + 12 * 3600e3));
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 864e5); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  const d = new Date(s); return isNaN(d) ? 'bad' : todayLocal(d);
}

async function xlsxLib() { if (!window.XLSX) await loadScript(XLSX_SRC); return window.XLSX; }
A.importTemplate = async kind => {

    ws['!cols'] = K.cols.map(c => ({ wch: Math.max(14, c[1].length + 2) }));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, K.label.slice(0, 30));

A.importFile = async file => {
  if (!file) return; const K = IMPORTS[S.imp.kind]; const out = $('#impResult');
  if (file.size > 8e6) { toast('This file is over 8 MB. Split it into smaller sheets.', 'bad'); return; }
  out.innerHTML = `<div class="banner">${ic('clock')}<span>Reading ${esc(file.name)}…</span></div>`;
  try {
    const X = await xlsxLib(); const isCsv = /\.(csv|txt)$/i.test(file.name) || /csv|text\/plain/.test(file.type);
    const wb = isCsv ? X.read((await file.text()).replace(/^\ufeff/, ''), { type: 'string', raw: false }) : X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]]; const raw = X.utils.sheet_to_json(ws, { header: 1, defval: '', blankrows: false });
    const hi = raw.findIndex(r => r.filter(c => String(c).trim()).length >= 1); if (hi < 0) throw new Error('The sheet is empty');
    const heads = raw[hi].map(normH);
    const map = {}; K.cols.forEach(([f, label, , al]) => { const idx = heads.findIndex(h => h && (h === normH(label) || al.some(a => h === normH(a)))); if (idx >= 0) map[f] = idx; });
    K.cols.forEach(([f, , , al]) => { if (map[f] == null) { const idx = heads.findIndex((h, i) => h && !Object.values(map).includes(i) && al.some(a => h.includes(normH(a)))); if (idx >= 0) map[f] = idx; } });
    const missing = K.cols.filter(([f, , req]) => req && map[f] == null).map(c => c[1]);
    if (missing.length) throw new Error(`Heading not found: ${missing.join(', ')}. Use the sample sheet headings.`);
    const existing = new Map(col(K.coll).map(x => [K.key(x), x]));
    const seen = new Set();
    const rows = raw.slice(hi + 1).map((r, i) => {
      const o = {}; K.cols.forEach(([f]) => { o[f] = map[f] != null ? r[map[f]] : ''; });
      const empty = !K.cols.some(([f]) => String(o[f] ?? '').trim()); if (empty) return null;
      const reqMiss = K.cols.filter(([f, , req]) => req && !String(o[f] ?? '').trim()).map(c => c[1]);
      let res = reqMiss.length ? { error: reqMiss.join(', ') + ' missing' } : K.build(o);
      const key = res.rec ? K.key(res.rec) : '';
      if (res.rec && seen.has(key)) res = { error: 'Repeated in this sheet' }; if (key) seen.add(key);
      return { line: hi + i + 2, src: o, ...res, exists: res.rec ? existing.get(key) : null };
    }).filter(Boolean);
    if (!rows.length) throw new Error('No rows found under the headings');
    S.imp.rows = rows; S.imp.file = file.name; renderImport();
  } catch (e) { out.innerHTML = `<div class="banner bad">${ic('alert')}<span>${esc(e.message || 'Could not read this file. Save it as .xlsx or .csv and try again.')}</span></div>`; }
};

    ${upd ? `<div class="seg" style="align-self:flex-start"><button type="button" class="${S.imp.mode === 'update' ? 'on' : ''}" onclick="S.imp.mode='update';renderImport()">Update existing</button><button type="button" class="${S.imp.mode === 'skip' ? 'on' : ''}" onclick="S.imp.mode='skip';renderImport()">Skip existing</button></div>` : ''}

    ${rows.length > show.length ? `<span class="tiny muted">Showing ${show.length} of ${rows.length} rows</span>` : ''}
    ${bad.length ? `<span class="small muted">Rows with problems are left out. Fix them in the sheet and upload again any time.</span>` : ''}
    <button type="button" class="btn primary" ${willDo ? '' : 'disabled'} onclick="A.importRun()">${ic('upload')} Import ${willDo} row${willDo === 1 ? '' : 's'}</button></div></div>`;
}

}

   (export, anniversaries, muhurat campaigns), QR poster, refer & share. */
const QR_SRC = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
const MK_TABS = [['followup', 'Follow-ups'], ['reviews', 'Google reviews'], ['ratecard', 'Rate card'], ['clients', 'Clients'], ['qr', 'QR poster'], ['share', 'Refer & share']];
const HI = () => I18N.lang === 'hi';
const refCode = orgId => String(orgId || '').replace(/[^a-z0-9]/gi, '').slice(0, 8).toLowerCase();
const phoneDigits = p => { const d = String(p || '').replace(/\D/g, ''); return d.length > 10 ? d.slice(-10) : d; };

function clientsList() {
  const map = new Map();
  col('events').filter(e => e.client).forEach(e => {
    const k = phoneDigits(e.phone) || e.client.trim().toLowerCase(); const c = map.get(k) || { name: e.client, phone: phoneDigits(e.phone), email: e.email || '', events: [], billed: 0 };
    c.events.push(e); if (!c.email && e.email) c.email = e.email; map.set(k, c);
  });
  const billedBy = {}; col('invoices').filter(i => i.type === 'invoice' && i.eventId).forEach(i => { billedBy[i.eventId] = (billedBy[i.eventId] || 0) + invCalc(i).total; });
  return [...map.values()].map(c => { c.events.sort((a, b) => (b.date || '').localeCompare(a.date || '')); c.last = c.events[0]; c.billed = sum(c.events, e => billedBy[e.id] || 0); return c; }).sort((a, b) => (b.last?.date || '').localeCompare(a.last?.date || ''));
}

/* ---------- drawing helpers (QR poster) ---------- */
function nextSaaya(limit = 6) { const t = todayLocal(); return (settings().saaya || []).filter(s => s.date >= t).sort(by('date')).slice(0, limit); }
const imgCache = {};
function loadImg(src) { if (!src) return Promise.resolve(null); if (imgCache[src]) return imgCache[src]; return (imgCache[src] = new Promise(res => { const i = new Image(); if (/^https?:/.test(src)) i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => res(null); i.src = src; })); }
async function fontsReady(text) { try { await Promise.all(['800 80px "Baloo 2"', '600 40px Mukta', '700 40px Mukta'].map(f => document.fonts.load(f, text))); } catch (e) { } }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- 4. Clients: list, export, anniversaries, muhurat campaigns ---------- */
function anniversaries(days = 30) {
  const t = todayLocal(); const y = +t.slice(0, 4);
  return col('events').filter(e => e.date && ['Wedding', 'Ring Ceremony'].includes(e.type) && e.stage !== 'Cancelled' && +e.date.slice(0, 4) < y).map(e => {
    let next = y + e.date.slice(4); if (next < t) next = (y + 1) + e.date.slice(4); return { e, next, d: daysBetween(t, next), years: +next.slice(0, 4) - +e.date.slice(0, 4) };
  }).filter(x => x.d >= 0 && x.d <= days).sort((a, b) => a.d - b.d);
}

  const head = kind === 'review' ? (HI() ? 'हमारा काम पसंद आया?' : 'Liked our work?') : (HI() ? 'बुकिंग के लिए स्कैन करें' : 'Scan to book with us');
  const sub = kind === 'review' ? (HI() ? 'स्कैन करें और गूगल पर रिव्यू लिखें' : 'Scan and write us a Google review') : (HI() ? 'सीधे व्हाट्सऐप पर बात करें' : 'Chat with us directly on WhatsApp');

  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = c1; ctx.fillRect(0, 0, W, 360); ctx.textAlign = 'center';
  let y = 90; if (logo) { const s = 140; ctx.save(); ctx.beginPath(); ctx.arc(W / 2, y + s / 2, s / 2 + 8, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.beginPath(); ctx.arc(W / 2, y + s / 2, s / 2, 0, 7); ctx.clip(); const r = Math.max(s / logo.width, s / logo.height); ctx.drawImage(logo, W / 2 - logo.width * r / 2, y + s / 2 - logo.height * r / 2, logo.width * r, logo.height * r); ctx.restore(); y += s + 70; } else y = 200;
  ctx.fillStyle = '#fff'; ctx.font = '800 64px "Baloo 2", sans-serif'; ctx.fillText(st.bizName || '', W / 2, y);
  ctx.fillStyle = '#121831'; ctx.font = '800 92px "Baloo 2", sans-serif'; ctx.fillText(head, W / 2, 500);
  ctx.fillStyle = '#475569'; ctx.font = '600 48px Mukta, sans-serif'; ctx.fillText(sub, W / 2, 575);
  const n = qr.getModuleCount(), box = 760, cell = Math.floor(box / (n + 8)), size = cell * (n + 8), x0 = (W - size) / 2, y0 = 640;
  ctx.fillStyle = '#fff'; ctx.fillRect(x0, y0, size, size); ctx.strokeStyle = c1; ctx.lineWidth = 10; roundRect(ctx, x0 - 20, y0 - 20, size + 40, size + 40, 40); ctx.stroke();
  ctx.fillStyle = '#000'; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(x0 + (c + 4) * cell, y0 + (r + 4) * cell, cell, cell);

  ctx.fillStyle = '#64748B'; ctx.font = '600 40px Mukta, sans-serif'; ctx.fillText([st.address, st.city].filter(Boolean).join(', ').slice(0, 60), W / 2, y0 + size + 210);
}
A.qrSave = async () => { await drawQrNow(); const cv = document.getElementById('qrCv'); if (!cv) return; cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'qr-poster.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }, 'image/png'); };

/* ================= Easy mode, crew screen, quick booking, live updates =================
   Goal: a tent-house owner or a crew member should be able to use the app in seconds.
   - Easy home (default): today at a glance + 4–6 big buttons. "Full app" is one tap away
     and nothing is removed (A.setFull).
   - Crew home: "I reached" (self attendance), my tasks with big % buttons, call/alert owner.
   - Quick booking: 4 fields (+ optional advance, + saved packages).
   - Live updates: changes made by anyone (e.g. crew sets setup to 40%) show on every open
     phone within a second (Supabase Realtime on `records`), plus a refresh when the app
     comes back to the screen. */

/* ---------- mode ---------- */
const isSimple = () => !!S.org && !LS.get('ep_full_' + S.org.orgId, false);
const isCrewUser = () => !!S.org && S.role !== 'owner' && (S.role === 'staff' || (!!S.me?.staffId && lvl('bookings') < 2));

/* ---------- live updates ---------- */
let liveChan = null, liveRenderT = null, lastFullLoad = Date.now();
function startLiveSync() {
  lastFullLoad = Date.now();
  if (S.adapter?.mode !== 'cloud' || !S.org) return;
  try { if (liveChan) S.adapter.sb.removeChannel(liveChan); } catch (e) { }
  const org = S.org.orgId;
  liveChan = S.adapter.sb.channel('rec-' + org).on('postgres_changes', { event: '*', schema: 'public', table: 'records', filter: 'org_id=eq.' + org }, p => {
    if (!S.org || S.org.orgId !== org) return;
    const row = p.eventType === 'DELETE' ? p.old : p.new; if (!row || !row.collection) return;
    if (p.eventType === 'DELETE') { S.data[row.collection] = col(row.collection).filter(x => x.id !== row.id); }
    else {
      const rec = row.data; if (!rec || !rec.id) return; const arr = col(row.collection); const i = arr.findIndex(x => x.id === rec.id);
      const old = i >= 0 ? arr[i] : null; if (i >= 0) arr[i] = rec; else arr.push(rec);
      if (rec.updatedById && rec.updatedById !== S.user?.id) liveNotice(row.collection, rec, old);
    }
    liveRender();
  }).subscribe();
}
function liveRender() {
  clearTimeout(liveRenderT);
  liveRenderT = setTimeout(() => { const a = document.activeElement; if (a && a.closest && a.closest('#app') && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) { liveRender(); return; } render(); }, 350);
}
function liveNotice(coll, rec, old) {
  const who = rec.updatedBy || 'Team';
  if (coll === 'tasks' && (lvl('tasks') >= 3 || S.role === 'owner') && (!old || old.progress !== rec.progress)) { const e = evById(rec.eventId); toast(`${who}: ${rec.title} ${rec.progress}%${e ? ' · ' + e.title : ''}`); }
  else if (coll === 'attendance' && rec.selfAt && (!old || old.selfAt !== rec.selfAt) && can('staff')) { const s = getById('staff', rec.staffId); toast(`${s?.name || who} reached at ${rec.selfAt}`); }
  else if (coll === 'events' && !old && can('bookings')) toast(`New booking: ${rec.title}`);
  else if (coll === 'payments' && !old && can('payments')) toast(`Payment received: ${inr(rec.amount)}`);
}
async function liveRefresh() {
  if (!S.org || S.adapter?.mode !== 'cloud' || Date.now() - lastFullLoad < 90e3) return;
  if (['suspended', 'expired'].includes(orgState(S.org))) return;
  try { const { data, members } = await S.adapter.loadOrg(S.org.orgId); S.data = data; S.members = members; lastFullLoad = Date.now(); liveRender(); } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') liveRefresh(); });

  f.querySelectorAll('[data-pk]').forEach(b => b.classList.toggle('on', b === btn)); f.pkg.value = id;
  if (p.budget && !f.budget.value) f.budget.value = p.budget;
  if (p.type) { const r = [...f.querySelectorAll('input[name=type]')].find(x => x.value === p.type); if (r) r.checked = true; }
};
A.saveQuickBooking = e => {
  e.preventDefault(); const v = readForm(e.target);
  if (!(v.client || '').trim()) { toast('Write the client name', 'bad'); return; }
  if (!v.date) { toast('Pick the event date', 'bad'); return; }
  withBtn(e, async () => {
    const p = (settings().packages || []).find(x => x.id === v.pkg); const adv = +v.advance || 0;
    const stage = v.confirmed || adv > 0 ? 'Confirmed' : 'Enquiry'; const type = v.type || 'Wedding';
    const rec = { id: uid('e_'), created: Date.now(), client: v.client.trim(), phone: v.phone || '', date: v.date, type, stage, budget: +v.budget || 0, pax: p?.pax || 0, venue: '', title: `${v.client.trim().split(' ').slice(-1)[0]} ${type}`,
      items: p?.items ? JSON.parse(JSON.stringify(p.items)) : [], schedule: [], menu: { dishIds: [...(p?.dishIds || [])], pax: p?.pax || 0 }, dispatch: {} };
    await save('events', rec, `Created booking ${rec.title}`);
    if (adv > 0 && can('payments', 2)) await save('payments', { id: uid('p_'), invoiceId: '', eventId: rec.id, amount: adv, date: todayLocal(), mode: 'Cash', ref: 'Advance', by: S.me?.name }, `Recorded payment ${inr(adv)}`);
    A.closeModal(); toast(adv > 0 ? `Booking saved with ${inr(adv)} advance` : 'Booking saved'); A.go('event', { id: rec.id });
  });
};
A.savePackage = evId => {
  const e = evById(evId); if (!e) return; need('settings', 2);
  formModal({ title: 'Save as package', sub: 'Next time, one tap fills these items, menu and amount', fields: [{ name: 'name', label: 'Package name', required: true, value: `${e.type} ${e.pax || ''}`.trim(), full: true, placeholder: 'e.g. Wedding 500 guests' }, { name: 'budget', label: 'Package amount ₹', type: 'number', min: 0, value: e.budget || '' }],
    onSubmit: async v => { const st = settings(); const pk = { id: uid('pk_'), name: v.name.trim(), type: e.type, budget: +v.budget || 0, pax: e.pax || 0, items: (e.items || []).map(x => ({ ...x })), dishIds: [...(e.menu?.dishIds || [])] };
      await saveSettingsRec({ packages: [...(st.packages || []), pk] }); logAct(`Saved package ${pk.name}`); toast('Package saved'); render(); } });
};
A.delPackage = id => confirmBox('Delete this package?', '', 'Delete', async () => { const st = settings(); await saveSettingsRec({ packages: (st.packages || []).filter(p => p.id !== id) }); render(); });
function packagesCard() {
  const pk = settings().packages || []; const edit = can('settings', 2);
  return `<div class="card"><div class="card-h"><div><h3>Booking packages${info('set-packages')}</h3><p>Ready sets of items, menu and amount. Pick one while making a booking.</p></div></div><div class="rows">${pk.map(p => `<div class="row">${ibox('gift', '#7C3AED', 'sm')}<div class="main-col"><b>${esc(p.name)}</b><div class="sub">${p.budget ? inr(p.budget) + ' · ' : ''}${(p.items || []).length} items · ${(p.dishIds || []).length} dishes${p.pax ? ' · ' + p.pax + ' guests' : ''}</div></div>${edit ? `<button class="icon-btn" style="width:36px;height:36px" aria-label="Delete package" onclick="A.delPackage('${p.id}')">${ic('trash')}</button>` : ''}</div>`).join('') || `<div class="row"><span class="small muted">No packages yet. Open any booking and tap “Save as package”.</span></div>`}</div></div>`;
}

/* ---------- simple access: who sees what ---------- */
const ROLE_HELP = {
  manager: 'Runs bookings, stock, catering and crew. Sees bills; cannot change team or settings.',
  accountant: 'Bills, payments and expenses. Sees bookings and reports.',
  supervisor: 'Site work: bookings, setup tasks, stock out and in, attendance.',
  staff: 'Crew: sees only their own work and marks attendance.'
};
function roleCards(cur, name = 'role') {
  return `<div class="role-cards">${Object.entries(S.roles).filter(([k]) => k !== 'owner').map(([k, r]) => `<label class="role-card"><input type="radio" name="${name}" value="${k}" ${cur === k ? 'checked' : ''}><span><b>${esc(r.label)}</b><small>${esc(ROLE_HELP[k] || 'Custom role')}</small></span></label>`).join('')}</div>`;
}
const LV3 = [[0, 'Off'], [1, 'See'], [2, 'Change']];
A.accessSheet = uidv => {
  const m = S.members.find(x => x.userId === uidv); if (!m) return; const rp = S.roles[m.role]?.perms || {}; const eff = { ...rp, ...(m.perms || {}) };
  modal(`<form class="form" onsubmit="A.saveAccess(event,'${uidv}')" novalidate>${sheetHead('What ' + (m.name || '').split(' ')[0] + ' can see', 'Tap to change. Saves for this person only.')}<div class="sheet-b stack">
    <div class="field"><span>Job</span>${roleCards(m.role)}</div>
    <div class="acc-list">${MODULES.filter(md => moduleOn(md.key)).map(md => { const cur = Math.min(2, +(eff[md.key] || 0)); return `<div class="acc-row">${ibox(md.icon, md.c, 'sm')}<b>${esc(md.label)}</b><div class="seg acc-seg">${LV3.map(([v, l]) => `<label><input type="radio" name="a_${md.key}" value="${v}" ${cur === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>`; }).join('')}</div>
    <p class="tiny muted">Off = section hidden. See = can look only. Change = can add and edit. Only the owner can delete.</p>
  </div><footer class="sheet-f"><button type="button" class="linkbtn" onclick="A.memberMore('${uidv}')">Password & more</button><span class="grow"></span><button class="btn primary" type="submit">Save</button></footer></form>`, { wide: true });
  document.querySelectorAll('.role-cards input').forEach(r => r.addEventListener('change', () => { const p = S.roles[r.value]?.perms || {}; MODULES.forEach(md => { const x = document.querySelector(`input[name="a_${md.key}"][value="${Math.min(2, +(p[md.key] || 0))}"]`); if (x) x.checked = true; }); }));
};
A.saveAccess = (e, uidv) => {
  e.preventDefault(); const f = e.target; const m = S.members.find(x => x.userId === uidv);
  withBtn(e, async () => {
    need('team', 3); const role = f.querySelector('input[name=role]:checked')?.value || m.role; const rp = S.roles[role]?.perms || {}; const perms = {};
    MODULES.forEach(md => { const x = f.querySelector(`input[name="a_${md.key}"]:checked`); if (!x) return; const v = +x.value; const def = Math.min(2, +(rp[md.key] || 0)); if (v !== def) perms[md.key] = v; });
    await S.adapter.updateMember(S.org.orgId, uidv, { staffId: m.staffId || '', perms, role });
    Object.assign(m, { perms: Object.keys(perms).length ? perms : null, role });
    logAct(`Updated access for ${m.name}`); A.closeModal(); toast('Access saved'); render();
  });
};

/* ---------- home screen switch (nothing removed: full home is one tap away) ---------- */
const fullDashboard = V.dashboard;
V.dashboard = () => {
  if (isSimple()) return isCrewUser() ? crewHome() : `<div class="sec-h" style="margin-top:0"><h2>Today${info('dashboard')}</h2></div>` + simpleHome();
  return `<div class="easy-switch"><button class="linkbtn" onclick="A.setFull(false)">${ic('home')} Switch to easy home</button></div>${whatsNewCard()}` + fullDashboard();
};

/* ---------- getting the Android app + what's new ---------- */
const APP_DL = 'https://sabmanage.com/download';
try { if (String(document.referrer).startsWith('android-app://com.sabmanage.app')) LS.set('ep_in_app', true); } catch (e) { }
const inAndroidApp = () => LS.get('ep_in_app', false);
A.shareAppLink = () => { const st = settings(); window.open(waLink(`${st.bizName ? st.bizName + ': ' : ''}SabManage app\n${T('Download')}: ${APP_DL}\n${T('Log in with your mobile number and the password the owner gives you.')}`, ''), '_blank', 'noopener'); };
const WHATS_NEW = [
  ['home', 'Easy home: today’s events, setup % and money to collect at the top'],
  ['calendar', 'New booking needs only 4 things; save packages for one-tap bookings'],
  ['pin', 'Crew get their own simple screen: “I have reached” and 25% / 50% / Done'],
  ['pulse', 'Crew updates show on your phone within a second'],
  ['bell', 'Alerts to your team ring with the SabManage tune']];
function whatsNewCard() {
  if (!S.org || LS.get('ep_new_v3', false) || isCrewUser()) return '';
  return `<div class="card pad whats-new"><div class="row-flex" style="justify-content:space-between;flex-wrap:nowrap"><b>${ic('sparkle')} What’s new in SabManage</b><button class="icon-btn" style="width:32px;height:32px" aria-label="Close" onclick="LS.set('ep_new_v3',true);render()">${ic('x')}</button></div>
    <ul>${WHATS_NEW.map(([i, t]) => `<li>${ic(i)}<span>${t}</span></li>`).join('')}</ul>
    <div class="row-flex">${!inAndroidApp() ? `<a class="btn sm primary" href="${APP_DL}" target="_blank" rel="noopener">${ic('download')} Get the Android app</a>` : ''}${can('team', 2) ? `<button class="btn sm wa" onclick="A.shareAppLink()">${ic('wa')} Send app to team</button>` : ''}</div></div>`;
}

boot();

</script>
</body>
</html>
