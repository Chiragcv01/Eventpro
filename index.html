<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout concept: phone-first business app — white cards on a cool grey ground, every module owns a colour,
   colourful icon tiles carry navigation (services grid), bottom tab bar with a centre + button on phones */
:root{
  color-scheme:light;
  --bg:#F3F5FA; --surface:#FFFFFF; --surface2:#F7F8FC; --line:#E5E8F1; --line2:#EEF0F6; --ink:#121831; --ink2:#38405C; --muted:#6A7290;
  --brand:#1F5EFF; --brand-ink:#FFFFFF; --brand-soft:#EAF0FF; --brand-dark:#1747C8;
  --primary:#1F5EFF; --primary-ink:#FFFFFF;
  --accent:#FF7A1A; --accent-soft:#FFF1E5; --accent-ink:#B04A00;
  --good:#0B9B68; --good-soft:#E2F6EE; --warn:#B86E00; --warn-soft:#FFF3DA; --bad:#E0344B; --bad-soft:#FDE7EA; --info:#1F5EFF; --info-soft:#EAF0FF;
  --scrim:rgba(14,19,40,.45);
  --paper:#FFFFFF; --paper-ink:#1B1A2E; --paper-muted:#5E5C78; --paper-line:#DDDBE8;
  --f-display:'Baloo 2','Mukta',system-ui,sans-serif;
  --f-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:18px; --r-sm:12px;
  --sh1:0 1px 2px rgba(18,24,49,.04),0 2px 8px rgba(18,24,49,.04);
  --sh2:0 2px 4px rgba(18,24,49,.05),0 12px 28px rgba(18,24,49,.09);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;font-weight:700;color:var(--ink)}
h1{font-size:clamp(24px,3.2vw,30px);font-weight:800} h2{font-size:20px} h3{font-size:18px} h4{font-size:15px}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums} .grow{flex:1}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.stripe{display:none}

/* Icon tile — every module/category has a colour passed as --c */
.ibox{--c:var(--brand);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);transition:transform .15s ease}
.ibox .ico{width:21px;height:21px;stroke-width:2.1}
.ibox.sm{width:32px;height:32px;border-radius:10px}.ibox.sm .ico{width:17px;height:17px}
.ibox.lg{width:56px;height:56px;border-radius:18px}.ibox.lg .ico{width:27px;height:27px}
.ibox.xl{width:72px;height:72px;border-radius:22px}.ibox.xl .ico{width:34px;height:34px}
.ibox.solid{background:var(--c);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 30%,transparent)}
.datebox{--c:var(--brand);width:50px;flex:none;border-radius:13px;text-align:center;padding:5px 0 4px;background:color-mix(in srgb,var(--c) 11%,#fff);color:var(--c)}
.datebox b{display:block;font:800 21px/1 var(--f-display)}
.datebox span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* App shell */
.app{display:flex;min-height:100%}
.side{width:256px;flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#1F5EFF,#00B4D8);color:#fff;display:grid;place-items:center;font:800 16px var(--f-display);flex:none;box-shadow:0 6px 14px rgba(31,94,255,.28)}
.logo .ico{width:22px;height:22px;stroke-width:2.2}
.brand b{font:800 18px/1.05 var(--f-display);display:block}
.brand span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;overflow:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 8px 6px}
.nav button{--c:var(--brand);display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:6px 8px;border-radius:13px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:15px;text-align:left}
.nav button:hover{background:var(--surface2)}
.nav button.on{background:color-mix(in srgb,var(--c) 9%,#fff);color:var(--ink);font-weight:700}
.nav button.on .ibox{background:var(--c);color:#fff}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FFB547,#FF7A1A);color:#fff;display:grid;place-items:center;font:800 14px var(--f-display);flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.topbar .org{min-width:0}
.topbar .org b{display:block;font:700 16px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding-block:20px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1220px;width:100%;margin:0 auto}
.mobile-only{display:none} .mob-inline{display:none}
.bnav{display:none}
@media (max-width:880px){
  .side{display:none} .mobile-only{display:flex} .mob-inline{display:inline} .desk-only{display:none!important}
  .content{padding-top:14px}
  .bnav{display:flex;align-items:flex-end;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(18,24,49,.06);padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:4px 0;cursor:pointer;min-width:0}
  .bnav button .ico{width:23px;height:23px}
  .bnav button.on{color:var(--brand)}
  .bnav .fabwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink2)}
  .bnav .fab{width:56px;height:56px;border-radius:19px;border:0;background:linear-gradient(135deg,#1F5EFF,#00B4D8);color:#fff;display:grid;place-items:center;margin-top:-30px;box-shadow:0 10px 22px rgba(31,94,255,.38);cursor:pointer}
  .bnav .fab .ico{width:28px;height:28px;stroke-width:2.6}
}
@media (min-width:881px){.mobile-hide-desk,.mobile-only,.mob-inline{display:none!important}}

/* Page head */
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phead .t{min-width:0;display:flex;align-items:center;gap:14px}
.phead p{color:var(--muted);font-size:14.5px;margin-top:2px;max-width:62ch}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--surface);border:1px solid var(--line);color:var(--ink2);cursor:pointer;padding:6px 12px 6px 8px;border-radius:99px;margin-bottom:12px;font-weight:700;font-size:13.5px}
.back .ico{width:17px;height:17px}
@media (max-width:560px){.phead .t .ibox{display:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .1s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:#CDD3E4}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(31,94,255,.25)}
.btn.primary:hover{background:var(--brand-dark)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(255,122,26,.28)}
.btn.wa{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.btn.danger{color:var(--bad);border-color:#F5C6CE;background:#fff}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.sm .ico{width:16px;height:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2);position:relative;flex:none}
.icon-btn .dot{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:4px 2px;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.linkbtn .ico{width:16px;height:16px}

/* Cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px}
.card-h p{font-size:13.5px;color:var(--muted)}
.card-h+.rows>.row:first-child{border-top:1px solid var(--line2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)} .g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.rows>.row{display:flex;align-items:center;gap:13px;padding:13px 18px;border-top:1px solid var(--line2);min-width:0}
.rows>.row:first-child{border-top:0}
.row .main-col{flex:1;min-width:0}
.row .main-col b{display:block;font-weight:700;line-height:1.3;overflow-wrap:anywhere;font-size:15.5px}
.row .sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.row.click{cursor:pointer;transition:background .12s} .row.click:hover{background:var(--surface2)}
.row .end{text-align:right;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec-h h2{font-size:20px}

/* Stat cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{--c:var(--brand);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;min-width:0;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:2px}
.kpi .kt{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.kpi .kt .eyebrow{font-size:11.5px;line-height:1.25}
.kpi .v{font:800 clamp(21px,2.6vw,27px)/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)} .kpi.accent .v{color:var(--accent-ink)}

/* Services grid (Paytm-style tiles) */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 6px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(8,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:600;line-height:1.2;color:var(--ink2);text-align:center;padding:2px;border-radius:14px;min-width:0}
.tile .ibox{width:56px;height:56px;border-radius:18px}.tile .ibox .ico{width:26px;height:26px}
.tile:hover .ibox{transform:translateY(-2px)}
.tile:active .ibox{transform:scale(.94)}

/* Banner hero */
.hero{--c:var(--brand);--c2:#00B4D8;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(125deg,var(--c),var(--c2));color:#fff;margin-bottom:16px;box-shadow:0 12px 28px color-mix(in srgb,var(--c) 28%,transparent)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-110px;background:rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:90px;bottom:-100px;background:rgba(255,255,255,.08)}
.hero .in{position:relative;z-index:1;padding:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.hero h1,.hero h2,.hero h3{color:#fff}
.hero p{opacity:.92;font-size:14.5px}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero .big{font:800 clamp(30px,5vw,40px)/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.hero .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28);color:#fff;box-shadow:none}
.hero .btn.white{background:#fff;color:var(--c);border-color:#fff}
.hero .hstats{display:flex;gap:22px;flex-wrap:wrap}
.hero .hstats div{min-width:0}
.hero .hstats b{display:block;font:800 20px/1.1 var(--f-display)}
.hero .hstats span{font-size:12.5px;opacity:.85}

/* Event swipe cards */
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,84%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
@media (min-width:700px){.hscroll{grid-auto-columns:minmax(260px,calc((100% - 24px)/3))}}
.evc{--c:var(--brand);scroll-snap-align:start;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--sh1);text-align:left;padding:0;min-width:0}
.evc .top{background:linear-gradient(130deg,var(--c),color-mix(in srgb,var(--c) 62%,#15103A));color:#fff;padding:14px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.evc .top::after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.evc .top .datebox{background:rgba(255,255,255,.2);color:#fff}
.evc .top b{font:700 17px/1.2 var(--f-display);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evc .top .tiny{opacity:.9}
.evc .bot{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.evc .meta{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.evc .meta span{display:inline-flex;align-items:center;gap:4px}
.evc .meta .ico{width:15px;height:15px}

/* Alert cards */
.alert{--c:var(--bad);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 6%,#fff);border:1px solid color-mix(in srgb,var(--c) 18%,#fff);cursor:pointer;min-width:0}
.alert b{display:block;font-size:14.5px;line-height:1.3}
.alert .sub{font-size:13px;color:var(--muted)}
.alert .ico.go{width:18px;height:18px;color:var(--muted)}

/* Pills & chips */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent} .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent} .pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent} .pill.primary{background:#F1EBFF;color:#6D28D9;border-color:transparent}
.evc .top .pill{background:rgba(255,255,255,.22);color:#fff;border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 15px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(31,94,255,.25)}
.seg{display:inline-flex;background:#ECEFF6;border-radius:14px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh1)}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 15px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;border-radius:99px;white-space:nowrap}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding-left:42px;border-radius:14px;min-height:46px;background:#fff}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Forms */
input,select,textarea{width:100%;min-height:46px;padding:10px 13px;border-radius:13px;border:1.5px solid var(--line);background:#fff;font-size:15.5px;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(31,94,255,.12)}
input[type=range]{padding:0;min-height:24px;border:0;background:none;box-shadow:none;accent-color:var(--brand)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid2 .full{grid-column:1/-1}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13.5px;font-weight:700;color:var(--ink2)}
.field small{color:var(--muted);font-size:12.5px}
.check{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
.check.full{grid-column:1/-1}
.checkcard{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:700;background:#fff}
.checkcard:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.inline-in{min-height:36px;padding:5px 9px;border-radius:10px;font-size:14.5px;border-width:1px}

/* Modal / bottom sheet */
#modalRoot{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:24px;width:min(580px,100%);max-height:min(88dvh,840px);overflow:auto;box-shadow:var(--sh2)}
.sheet.wide{width:min(880px,100%)}
@media (max-width:620px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:24px 24px 0 0;max-height:92dvh;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
  .sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:#D7DBE7;margin:9px auto 0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 20px 10px;position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-h h3{font-size:20px}
.sheet-h p{font-size:13.5px;margin-top:2px}
.sheet-h .icon-btn{width:36px;height:36px;border-radius:12px;background:var(--surface2);border-color:transparent}
.sheet-b{padding:4px 20px 20px}
.form .grid2{padding:4px 20px 10px}
.sheet-f{display:flex;gap:8px;align-items:center;padding:12px 20px 16px;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line2);flex-wrap:wrap}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:80;box-shadow:var(--sh2);max-width:calc(100% - 32px);text-align:center}
.toast.bad{background:var(--bad)} .toast.warn{background:#C26A00}
@media (min-width:881px){.toast{bottom:24px}}

/* Progress */
.prog{height:9px;background:#ECEFF6;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#1F5EFF,#00C2A8);border-radius:99px}
.stepper{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.stepper::-webkit-scrollbar{display:none}
.step{flex:1;min-width:74px;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--muted);font-size:12px;font-weight:700}
.step i{display:block;height:6px;border-radius:6px;background:#E3E7F0;margin-bottom:6px}
.step.done i{background:var(--good)} .step.cur i{background:var(--brand)} .step.cur{color:var(--brand)}
.step[disabled]{cursor:default}

/* Tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;background:var(--surface2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal .day{min-height:80px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.cal .day.out{opacity:.4}
.cal .day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal .day.today .dn{color:var(--brand)}
.cal .day.sel{background:var(--brand-soft)}
.cal .day.saaya{background:linear-gradient(180deg,#FFF0E2,#fff 70%)}
.cal .dn{font-size:13px;font-weight:800}
.cal .ev{font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#F1EBFF;color:#6D28D9}
.cal .ev.good{background:var(--good-soft);color:var(--good)} .cal .ev.warn{background:var(--warn-soft);color:var(--warn)} .cal .ev.accent{background:var(--accent-soft);color:var(--accent-ink)}
@media (max-width:620px){.cal{gap:3px}.cal .day{min-height:52px;padding:4px;border-radius:10px}.cal .ev{font-size:0;height:6px;padding:0;border-radius:3px}}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#ECEFF6;border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h4{display:flex;justify-content:space-between;padding:4px 4px 2px}
.mini{background:#fff;border-radius:14px;padding:11px;cursor:pointer;box-shadow:var(--sh1)}

/* Auth */
.auth{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#fff}
.auth-brand{background:linear-gradient(160deg,#EEF3FF 0%,#F4FBFF 55%,#FFF4EA 100%);display:flex;flex-direction:column;position:relative;overflow:hidden}
.auth-brand .inner{padding-block:44px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:36px;display:flex;flex-direction:column;gap:26px;flex:1;justify-content:center;max-width:600px}
.auth-brand h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.01em}
.auth-brand h1 em{font-style:normal;background:linear-gradient(90deg,#1F5EFF,#00A3C4);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-brand p{color:var(--ink2);max-width:46ch;font-size:16px}
.showcase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:440px}
.showcase .sc{background:#fff;border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh1);font-size:12.5px;font-weight:700;color:var(--ink2);text-align:center}
.floatstat{display:flex;gap:12px;flex-wrap:wrap}
.floatstat div{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:var(--sh1);display:flex;gap:10px;align-items:center}
.floatstat b{display:block;font:800 17px/1.1 var(--f-display)}
.floatstat span{font-size:12px;color:var(--muted)}
.auth-side{display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
.demo{border-radius:20px;padding:14px;background:linear-gradient(135deg,#FFF6EC,#FFF0F5)}
.demo .chips{flex-wrap:wrap}
.demo .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 6px}
.demo .chip .ibox{width:24px;height:24px;border-radius:8px}.demo .chip .ibox .ico{width:14px;height:14px}
@media (max-width:880px){.auth{grid-template-columns:minmax(0,1fr)}.auth-brand .inner{padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;gap:14px}.auth-brand p{font-size:14.5px}.floatstat,.auth-brand .desk-only{display:none}.showcase{gap:8px}.showcase .sc{font-size:11.5px;padding:10px 4px 8px}.showcase .sc .ibox{width:38px;height:38px;border-radius:12px}}

/* Banner (inline notices) */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--info-soft);color:#1A47C2;font-size:14px;font-weight:500}
.banner.warn{background:var(--warn-soft);color:#8A5200} .banner.bad{background:var(--bad-soft);color:#B4182F} .banner.good{background:var(--good-soft);color:#08744E}
.banner .ico{margin-top:1px;width:18px;height:18px}
.empty{padding:30px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.empty .ibox{margin-bottom:4px}

/* Veg mark (Indian food label) */
.veg{width:16px;height:16px;border:2px solid #0B9B68;border-radius:3px;display:inline-grid;place-items:center;flex:none}
.veg::after{content:"";width:7px;height:7px;border-radius:50%;background:#0B9B68}
.dishrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer}
.dishrow:has(input:checked){background:#F2FBF6}

/* Perm matrix */
.perm select{min-height:34px;padding:3px 8px;font-size:13.5px;border-radius:9px;min-width:92px;border-width:1px}
.lvl0{color:var(--muted)} .lvl3{color:var(--good);font-weight:700}

/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Paper (invoice/challan) */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:14px;border:1px solid var(--paper-line);padding:24px;font-size:13.5px;max-width:880px;margin:0 auto}
.paper h2{color:var(--paper-ink)}
.paper .pm{color:var(--paper-muted)}
.paper table{width:100%;border-collapse:collapse}
.paper th{background:#F1F4FB;color:#3A3858;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:7px 8px}
.paper td{border-bottom:1px solid var(--paper-line);padding:7px 8px;vertical-align:top}
.paper .r{text-align:right;font-variant-numeric:tabular-nums}
.paper .tot td{border:0;padding:4px 8px}
.paper .grand td{font-weight:800;font-size:15px;border-top:2px solid var(--paper-ink)}
.paper .pstripe{height:6px;background:linear-gradient(90deg,#1F5EFF,#00B4D8);margin:-24px -24px 18px;border-radius:14px 14px 0 0}
.paper-wrap{overflow-x:auto}
@media (max-width:560px){.paper{padding:16px;font-size:12.5px}.paper .pstripe{margin:-16px -16px 14px}}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  #printArea .paper{border:0;max-width:none}
  .no-print{display:none!important}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .2s ease-out}
@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Event header + inventory triplets */
.evhead{cursor:default;margin-bottom:16px}
.evhead .top{padding:18px}
.evhead .top b{font:800 clamp(22px,3vw,28px)/1.15 var(--f-display);white-space:normal}
.evhead .datebox{width:58px}.evhead .datebox b{font-size:25px}
.evhead .bot{padding:14px 18px 16px;gap:12px}
.evhead .meta{font-size:14px;color:var(--ink2);gap:16px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tri div{border-radius:12px;padding:7px 4px;text-align:center;background:var(--surface2)}
.tri span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.tri b{font:800 18px/1.15 var(--f-display)}
.tri .bk{background:var(--accent-soft)} .tri .bk b{color:var(--accent-ink)}
.tri .fr{background:var(--good-soft)} .tri .fr b{color:var(--good)}
.tri .sh{background:var(--bad-soft)} .tri .sh b{color:var(--bad)}

/* Business logo in app chrome */
.logo.has-img{background:#fff;border:1px solid var(--line);box-shadow:none;overflow:hidden;padding:3px}
.logo.has-img img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px}

/* Branding settings */
.brandgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;padding:4px 18px 18px}
.upl{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:16px;padding:14px;min-width:0}
.imgbox{width:76px;height:76px;flex:none;border-radius:16px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);overflow:hidden;border:1px solid var(--line)}
.imgbox .ico{width:28px;height:28px}
.imgbox img{width:100%;height:100%;object-fit:contain}
.imgbox.stamp{width:110px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;min-height:0;padding:0;border:0}
.perm select.ovr{border-color:var(--accent);background:var(--accent-soft);font-weight:700}

/* Branded paper */
.paper{--pb:#1F5EFF}
.paper .pstripe{background:var(--pb)}
.paper .phd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.paper .plogo{width:74px;height:74px;object-fit:contain;border-radius:12px;flex:none}
.paper .pbiz{flex:1;min-width:200px}
.paper h2.biz{font:800 22px/1.15 var(--f-display);color:var(--pb);margin-bottom:2px}
.paper .ptag{font-style:italic;color:var(--paper-muted);font-size:12.5px;margin-bottom:4px}
.paper .pmeta{text-align:right;margin-left:auto}
.paper .ptitle{letter-spacing:.08em;color:var(--pb);display:block;font-size:14px;margin-bottom:2px}
.paper th{background:color-mix(in srgb,var(--pb) 10%,#fff);color:color-mix(in srgb,var(--pb) 70%,#111)}
.paper .grand td{border-top-color:var(--pb)}
.paper .psign{text-align:right;margin-left:auto}
.paper .psign img{max-height:66px;max-width:190px;object-fit:contain;display:block;margin:0 0 4px auto}
.paper.mini{font-size:12.5px;padding:16px;max-width:none}
.paper.mini .pstripe{margin:-16px -16px 12px}

function loginId(v) { v = String(v || '').trim(); if (v.includes('@')) return v.toLowerCase(); const d = v.replace(/\D/g, ''); return d.length >= 10 ? d.slice(-10) + '@' + MOBILE_DOMAIN : v.toLowerCase(); }

/* ================= Data adapters ================= */
const LocalDB = (() => {
  const KEY = 'eventpro_v3_db'; let mem = null;
  const load = () => mem || (mem = LS.get(KEY, null) || { users: [], orgs: {}, members: [], roles: {}, records: {}, invites: [], guests: [], session: null });
  const persist = () => LS.set(KEY, mem);
  return {
    mode: 'local',
    async init() { load(); },
    async hash(p) { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ep3:' + p)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { let h = 7; for (const c of 'ep3:' + p) h = (h * 31 + c.charCodeAt(0)) | 0; return 'h' + h; } },
    async signUp({ email, password, name, phone }) {
      const db = load(); email = email.toLowerCase().trim();
      if (db.users.find(u => u.email === email)) throw new Error('This email or mobile already has an account. Log in instead.');
      const u = { id: uid('u_'), email, name, phone, pass: await this.hash(password), created: Date.now(), superAdmin: superEmails().includes(email) };
      db.users.push(u); db.session = { userId: u.id }; persist(); return { id: u.id, email, name };
    },
    async signIn(email, password) {
      const db = load(); const u = db.users.find(x => x.email === email.toLowerCase().trim());
      if (!u || u.pass !== await this.hash(password)) throw new Error('Login ID or password is wrong.');
      if (u.blocked) throw new Error('This login is blocked. Contact Super Admin.');
      db.session = { userId: u.id }; persist(); return { id: u.id, email: u.email, name: u.name };
    },
    async signOut() { load().session = null; persist(); },
    async current() { const db = load(); if (!db.session) return null; const u = db.users.find(x => x.id === db.session.userId); return u ? { id: u.id, email: u.email, name: u.name } : null; },
    async myOrgs(userId) { const db = load(); return db.members.filter(m => m.userId === userId).map(m => ({ orgId: m.orgId, name: db.orgs[m.orgId]?.name || 'Business', role: m.role, perms: m.perms, ...this.orgMeta(m.orgId) })); },
    orgMeta(id) { const o = load().orgs[id] || {}; return { status: o.status || 'active', plan: o.plan || 'Pro', expires: o.expires || '', notes: o.notes || '' }; },
    async mfaState() { return null; }, async mfaIsOn() { return false; },
    async mfaEnroll() { throw new Error('Authenticator works only in the live (cloud) app.'); },
    async resetUserMfa() { throw new Error('Authenticator works only in the live (cloud) app.'); },
    async isSuperAdmin(userId) { const u = load().users.find(x => x.id === userId); return !!(u && (u.superAdmin || superEmails().includes(u.email))); },
    async adminOverview() {
      const db = load();
      return Object.entries(db.orgs).map(([id, o]) => { const R = db.records[id] || {}; const st = R.settings?.main || {}; const own = db.members.find(m => m.orgId === id && m.role === 'owner');
        const upd = Math.max(o.created || 0, ...Object.values(R).flatMap(c => Object.values(c).map(r => r.updatedAt || 0)));
        return { orgId: id, name: o.name, created: o.created, ...this.orgMeta(id), ownerName: own?.name, ownerEmail: own?.email, ownerPhone: st.phone, city: st.city, logo: st.logo, members: db.members.filter(m => m.orgId === id).length, bookings: Object.keys(R.events || {}).length, invoices: Object.keys(R.invoices || {}).length, lastActivity: upd }; })
        .sort((a, b) => (b.created || 0) - (a.created || 0));
    },
    async adminUpdateOrg(id, patch) { const o = load().orgs[id]; if (!o) throw new Error('Business not found'); Object.assign(o, patch); persist(); },
    async adminUsers() { const db = load(); return db.users.map(u => ({ userId: u.id, email: u.email, name: u.name, created: u.created, blocked: !!u.blocked, super: !!(u.superAdmin || superEmails().includes(u.email)), orgs: db.members.filter(m => m.userId === u.id).map(m => ({ name: db.orgs[m.orgId]?.name, role: m.role })) })); },
    async adminSetSuper(email, on) { const db = load(); const u = db.users.find(x => x.email === loginId(email)); if (!u) throw new Error('No account with this email or mobile. Ask them to sign up first.'); if (!on && u.id === db.session?.userId) throw new Error('You cannot remove your own Super Admin access.'); u.superAdmin = !!on; persist(); },
    async getPlatform() { return { ...DEFAULT_PLATFORM, ...(load().platform || {}) }; },
    async savePlatform(p) { load().platform = p; persist(); },
    async createOrg(userId, name, displayName, roles, settings) {
      const db = load(); const id = uid('o_'); db.orgs[id] = { name, created: Date.now(), status: 'trial', plan: 'Trial', expires: addDays(todayLocal(), +(S.platform?.trialDays || DEFAULT_PLATFORM.trialDays)) };
      db.members.push({ orgId: id, userId, role: 'owner', name: displayName, email: db.users.find(u => u.id === userId)?.email });
      db.roles[id] = roles; db.records[id] = { settings: { main: settings } }; persist(); return id;
    },
    async loadOrg(orgId) {
      const db = load(); const recs = db.records[orgId] || {}; const data = {};
      for (const [c, m] of Object.entries(recs)) data[c] = Object.values(m);
      return { data, roles: JSON.parse(JSON.stringify(db.roles[orgId] || {})), members: db.members.filter(m => m.orgId === orgId).map(m => ({ ...m })) };
    },
    async put(orgId, coll, rec) { const db = load(); db.records[orgId] = db.records[orgId] || {}; (db.records[orgId][coll] = db.records[orgId][coll] || {})[rec.id] = JSON.parse(JSON.stringify(rec)); if (coll === 'settings' && rec.bizName) db.orgs[orgId].name = rec.bizName; persist(); },
    async del(orgId, coll, id) { const db = load(); if (db.records[orgId]?.[coll]) delete db.records[orgId][coll][id]; persist(); },
    async saveRoles(orgId, roles) { load().roles[orgId] = JSON.parse(JSON.stringify(roles)); persist(); },
    async createInvite(orgId, role, name) { const db = load(); const code = inviteCode(); db.invites.push({ code, orgId, role, name, created: Date.now(), expires: Date.now() + 7 * 864e5 }); persist(); return code; },
    async acceptInvite(userId, code, displayName) {
      const db = load(); code = String(code).toUpperCase().trim();
      const inv = db.invites.find(i => i.code === code && !i.usedBy && i.expires > Date.now());
      if (!inv) throw new Error('Invite code not found, expired or already used.');
      if (db.members.find(m => m.orgId === inv.orgId && m.userId === userId)) throw new Error('You are already part of this business.');
      const u = db.users.find(x => x.id === userId);
      db.members.push({ orgId: inv.orgId, userId, role: inv.role, name: displayName || inv.name || u?.name, email: u?.email }); inv.usedBy = userId; persist(); return inv.orgId;
    },
    async listInvites(orgId) { return load().invites.filter(i => i.orgId === orgId && !i.usedBy && i.expires > Date.now()); },
    async revokeInvite(code) { const db = load(); db.invites = db.invites.filter(i => i.code !== code); persist(); },
    async updateMember(orgId, userId, patch) { const db = load(); const m = db.members.find(x => x.orgId === orgId && x.userId === userId); if (m) Object.assign(m, patch); persist(); },
    async removeMember(orgId, userId) { const db = load(); db.members = db.members.filter(x => !(x.orgId === orgId && x.userId === userId)); persist(); },
    async signUpBusiness({ email, password, name, phone, bizName, roles, settings }) {
      if ((S.platform?.allowSignup) === false) throw new Error('New business sign-ups are closed. Please contact support.');
      const u = await this.signUp({ email, password, name, phone }); await this.createOrg(u.id, bizName, name, roles, settings); load().session = null; persist();
    },
    async createMember(orgId, { name, email, password, role, perms, staffId }) {
      const db = load(); email = loginId(email); if (!email.includes('@')) throw new Error('Enter an email or a 10-digit mobile number');
      if ((password || '').length < 6) throw new Error('Password must be at least 6 characters');
      if (db.users.find(u => u.email === email)) throw new Error('This login ID is already in use. Use another email or mobile number.');
      const u = { id: uid('u_'), email, name, phone: '', pass: await this.hash(password), created: Date.now() }; db.users.push(u);
      const m = { orgId, userId: u.id, role, name, email, perms: perms && Object.keys(perms).length ? perms : null, staffId: staffId || '' }; db.members.push(m); persist(); return { ...m };
    },
    async adminCreateBusiness({ email, password, name, phone, bizName, roles, settings, plan, status, expires }) {

function moduleOn(key) {
  const m = MOD[key]; const st = settings();
  if (st.modules && st.modules[key] === false) return false;
  if (st.modules && st.modules[key] === true) return true;
  if (!m?.biz) return true;
  return m.biz.some(b => (st.bizTypes || []).includes(b));
}
function lvl(mod) { if (S.super) return 3; let v = S.role === 'owner' ? 3 : Number(S.perms?.[mod] || 0); if (S.org && orgState(S.org) === 'expired') v = Math.min(v, 1); return v; }
function can(mod, l = 1) { return !!S.org && moduleOn(mod) && lvl(mod) >= l; }
function need(mod, l = 2) { if (lvl(mod) < l) throw new Error(S.org && orgState(S.org) === 'expired' ? 'Your plan has expired, so the app is read-only. Renew to make changes.' : 'Your role does not have permission for this. Ask the owner to update access.'); }

async function save(coll, rec, msg) {
  need(COLL_MODULE[coll] || 'settings', 2);
  rec.updatedAt = Date.now(); rec.updatedBy = S.me?.name || S.user?.name;
  const arr = col(coll); const i = arr.findIndex(x => x.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.unshift(rec);
  await S.adapter.put(S.org.orgId, coll, rec);
  if (msg) logAct(msg);
  return rec;
}
async function removeRec(coll, id, msg) {

function fieldHTML(f) {
  const id = 'f_' + f.name; const v = f.value ?? ''; const req = f.required ? 'required' : '';

  let input;

  else if (f.type === 'textarea') input = `<textarea id="${id}" name="${f.name}" rows="${f.rows || 3}" ${req} placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  else input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} step="${f.step || (f.type === 'number' ? 'any' : '')}" placeholder="${esc(f.placeholder || '')}" ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''} ${f.autofocus ? 'autofocus' : ''} ${f.minlength ? `minlength="${f.minlength}"` : ''}>`;

function readForm(form) {
  const v = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') { if (el.dataset.multi) { (v[el.name] = v[el.name] || []); if (el.checked) v[el.name].push(el.value); } else v[el.name] = el.checked; }
    else if (el.type === 'number') v[el.name] = el.value === '' ? '' : Number(el.value);
    else if (el.type === 'password') v[el.name] = el.value;
    else v[el.name] = (el.value || '').trim();

/* ================= Business logic ================= */
function evById(id) { return getById('events', id); }
function eventEnd(e) { return e.endDate && e.endDate >= e.date ? e.endDate : e.date; }
function reservedOn(invId, date, exceptEv) {
  return sum(col('events').filter(e => e.id !== exceptEv && RESERVING.includes(e.stage) && e.date <= date && eventEnd(e) >= date), e => (e.items || []).filter(i => i.invId === invId).reduce((s, i) => s + (+i.qty || 0), 0));
}
function availableOn(item, date, exceptEv) { return (+item.total || 0) - (+item.damaged || 0) - reservedOn(item.id, date, exceptEv); }
function onRent(item) { return sum(col('events').filter(e => e.dispatch?.out && !e.dispatch?.returned), e => (e.items || []).filter(i => i.invId === item.id).reduce((s, i) => s + (+i.qty || 0), 0)); }
function shortages() {
  const out = []; const t = todayLocal();
  col('events').filter(e => RESERVING.includes(e.stage) && eventEnd(e) >= t).forEach(e => (e.items || []).forEach(it => {
    const item = getById('inventory', it.invId); if (!item) return;
    const a = availableOn(item, e.date); if (a < 0) out.push({ ev: e, item, short: -a });
  }));
  return out;
}
function invCalc(inv, payments) {
  const lines = inv.lines || [];
  const sub = lines.reduce((s, l) => s + (+l.qty || 0) * (+l.rate || 0) * (+l.days || 1), 0);
  const disc = +inv.discount || 0; const base = Math.max(0, sub - disc); const r = (+inv.gstRate || 0) / 100;
  let taxable, gst, total;
  if (inv.gstMode === 'none') { taxable = base; gst = 0; total = base; }
  else if (inv.gstMode === 'incl') { total = base; taxable = base / (1 + r); gst = base - taxable; }
  else { taxable = base; gst = base * r; total = base + gst; }
  total = Math.round(total);
  const pays = (payments || col('payments')).filter(p => p.invoiceId === inv.id);
  const paid = sum(pays, p => p.amount);
  return { sub, disc, taxable, gst, cgst: inv.interstate ? 0 : gst / 2, sgst: inv.interstate ? 0 : gst / 2, igst: inv.interstate ? gst : 0, total, paid, balance: total - paid, pays };
}
function invStatus(inv, c) {
  c = c || invCalc(inv);
  if (inv.type === 'quotation') return inv.converted ? ['Converted', ''] : ['Quotation', 'info'];
  if (c.total > 0 && c.balance <= 0) return ['Paid', 'good'];
  if (inv.dueDate && inv.dueDate < todayLocal()) return ['Overdue', 'bad'];
  if (c.paid > 0) return ['Partial', 'warn'];
  return ['Unpaid', 'warn'];
}
function eventInvoices(evId) { return col('invoices').filter(i => i.eventId === evId); }
function wageCost(filter) { const staff = Object.fromEntries(col('staff').map(s => [s.id, s])); return sum(col('attendance').filter(filter), a => (a.status === 'P' ? 1 : a.status === 'H' ? .5 : 0) * (+staff[a.staffId]?.rate || 0)); }
function eventMoney(e) {
  const invs = eventInvoices(e.id).filter(i => i.type === 'invoice');
  const billed = sum(invs, i => invCalc(i).total);
  const received = sum(col('payments').filter(p => p.eventId === e.id), p => p.amount);
  const revenue = billed || (+e.budget || 0);
  const po = sum(col('pos').filter(p => p.eventId === e.id), p => p.amount);
  const exp = sum(col('expenses').filter(x => x.eventId === e.id), x => x.amount);
  const wages = wageCost(a => a.eventId === e.id);
  const cost = po + exp + wages;
  return { billed, received, revenue, po, exp, wages, cost, profit: revenue - cost, margin: revenue ? (revenue - cost) / revenue * 100 : 0, due: (billed || +e.budget || 0) - received };
}
function eventProgress(e) { const t = col('tasks').filter(x => x.eventId === e.id); return t.length ? sum(t, x => x.progress) / t.length : null; }
function computeAlerts() {
  if (!S.org) return [];
  const out = []; const t = todayLocal();
  if (can('invoices')) col('invoices').filter(i => i.type === 'invoice').forEach(i => { const c = invCalc(i); if (c.balance > 0 && i.dueDate && i.dueDate < t) out.push({ tag: 'Overdue', tone: 'bad', title: `${i.client || 'Client'} owes ${inr(c.balance)}`, sub: `${i.no} · due ${fmtDate(i.dueDate)} (${daysBetween(i.dueDate, t)} days late)`, go: `A.go('invoice',{id:'${i.id}'})` }); });
  if (can('inventory')) shortages().forEach(s => out.push({ tag: 'Shortage', tone: 'bad', title: `${s.short} × ${s.item.name} short`, sub: `${s.ev.title} on ${fmtDate(s.ev.date)}. Rent from a partner or move a booking.`, go: `A.go('event',{id:'${s.ev.id}',tab:'items'})` }));
  if (can('bookings')) col('events').forEach(e => {
    const d = daysBetween(t, e.date);
    if (['Enquiry', 'Quoted'].includes(e.stage) && d >= 0 && d <= 5) out.push({ tag: 'Confirm', tone: 'warn', title: `${e.title} not confirmed yet`, sub: `${fmtDate(e.date)} · ${d} day(s) left. Call ${e.client}.`, go: `A.go('event',{id:'${e.id}'})` });
    if (RESERVING.includes(e.stage) && (e.items || []).length && !e.dispatch?.out && d >= 0 && d <= 1) out.push({ tag: 'Dispatch', tone: 'accent', title: `Load truck for ${e.title}`, sub: `${(e.items || []).length} item types · ${fmtDate(e.date)}`, go: `A.go('event',{id:'${e.id}',tab:'items'})` });
    if (e.dispatch?.out && !e.dispatch?.returned && eventEnd(e) < t) out.push({ tag: 'Return', tone: 'warn', title: `Material not back from ${e.title}`, sub: `Event ended ${fmtDate(eventEnd(e))}. Mark the return and log damage.`, go: `A.go('event',{id:'${e.id}',tab:'items'})` });
  });
  return out;
}

V.dashboard = () => {
  const t = todayLocal(); const in7 = addDays(t, 7);
  const evs = col('events').filter(e => !['Cancelled', 'Closed'].includes(e.stage));
  const upcoming = evs.filter(e => eventEnd(e) >= t && e.stage !== 'Completed').sort(by('date'));
  const week = upcoming.filter(e => e.date <= in7);
  const todayEv = upcoming.filter(e => e.date <= t && eventEnd(e) >= t);
  const money = can('invoices') || can('payments');
  const outstanding = sum(col('invoices').filter(i => i.type === 'invoice'), i => Math.max(0, invCalc(i).balance));
  const monthStart = t.slice(0, 8) + '01';
  const monthPays = col('payments').filter(p => p.date >= monthStart);
  const collected = sum(monthPays, p => p.amount);

function cateringCalc() {
  const c = S.cat; const st = settings(); const rates = mandi(); const effPax = Math.round(c.pax * (1 + c.buffer / 100)); const agg = {};
  const dishes = col('dishes').filter(d => c.selected.includes(d.id));
  dishes.forEach(d => Object.entries(d.ration || {}).forEach(([k, v]) => agg[k] = (agg[k] || 0) + (+v || 0) * effPax));
  const rows = Object.entries(agg).map(([k, q]) => ({ name: k, qty: q, rate: +rates[k] || 0, cost: q * (+rates[k] || 0) })).sort((a, b) => b.cost - a.cost);
  const raw = sum(rows, r => r.cost); const rawPerPlate = c.pax ? raw / c.pax : 0; const costPerPlate = rawPerPlate + (+st.overheadPerPlate || 0);
  const sell = Math.ceil(costPerPlate * (1 + c.markup / 100) / 5) * 5;
  return { effPax, rows, raw, rawPerPlate, costPerPlate, sell, total: sell * c.pax, dishes };
}

/* ================= Reports ================= */
function periodRange(p) {
  const t = todayLocal(); const d = new Date(t + 'T00:00');
  if (p === 'month') return [t.slice(0, 8) + '01', t];
  if (p === 'last') { const s = todayLocal(new Date(d.getFullYear(), d.getMonth() - 1, 1)); const e = todayLocal(new Date(d.getFullYear(), d.getMonth(), 0)); return [s, e]; }
  if (p === 'fy') { const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return [`${y}-04-01`, `${y + 1}-03-31`]; }
  return ['0000-01-01', '9999-12-31'];
}
V.reports = () => {
  const p = S.filters.period || 'fy'; const [a, b] = periodRange(p); const inR = d => d && d >= a && d <= b;
  const invs = col('invoices').filter(i => i.type === 'invoice' && inR(i.date)); const billed = sum(invs, i => invCalc(i).total); const gst = sum(invs, i => invCalc(i).gst);
  const collected = sum(col('payments').filter(x => inR(x.date)), x => x.amount);
  const po = sum(col('pos').filter(x => inR(x.date)), x => x.amount); const exp = sum(col('expenses').filter(x => inR(x.date)), x => x.amount); const wages = wageCost(x => inR(x.date));
  const cost = po + exp + wages; const net = billed - gst - cost;
  const months = []; const base = new Date(todayLocal() + 'T00:00'); for (let k = 5; k >= 0; k--) { const m = todayLocal(new Date(base.getFullYear(), base.getMonth() - k, 1)).slice(0, 7); months.push(m); }
  const mrev = months.map(m => sum(col('invoices').filter(i => i.type === 'invoice' && (i.date || '').startsWith(m)), i => invCalc(i).total));
  const mcost = months.map(m => sum(col('pos').filter(x => (x.date || '').startsWith(m)), x => x.amount) + sum(col('expenses').filter(x => x.date.startsWith(m)), x => x.amount) + wageCost(x => x.date.startsWith(m)));
  const evs = col('events').filter(e => inR(e.date) && e.stage !== 'Cancelled').map(e => ({ e, m: eventMoney(e) })).sort((x, y) => y.m.revenue - x.m.revenue);
  return pageHead('Reports & P&L', `${fmtDate(a === '0000-01-01' ? null : a)} to ${fmtDate(b === '9999-12-31' ? todayLocal() : b)}`, `${seg('period', [['month', 'This month'], ['last', 'Last month'], ['fy', 'This FY'], ['all', 'All time']], p, 'A.setF')}${!FRAMED ? `<button class="btn sm" onclick="A.dl('pnl.csv')">${ic('download')} CSV</button>` : ''}`) +
  `<div class="kpis">${kpi('Billed', inr(billed), `GST ${inr(gst)}`)}${kpi('Collected', inr(collected), '', 'good', 'rupee', '#0B9B68')}${kpi('Costs', inr(cost), `Vendors ${inr(po)} · Exp ${inr(exp)} · Wages ${inr(wages)}`)}${kpi('Net profit (ex-GST)', inr(net), billed ? (net / (billed - gst) * 100).toFixed(1) + '% margin' : '', net >= 0 ? 'good' : 'bad')}</div>
  <div class="split"><div class="card pad"><div class="row-flex" style="justify-content:space-between;margin-bottom:8px"><h3>Last 6 months</h3><div class="legend"><span><i style="background:var(--primary)"></i>Billed</span><span><i style="background:var(--accent)"></i>Costs</span></div></div><div class="chart">${barChart(months, mrev, mcost)}</div></div>
  <div class="card pad stack-sm"><h3>Where the money goes</h3>${[['Vendor POs', po], ['Expenses', exp], ['Crew wages', wages]].map(([l, v]) => `<div><div class="row-flex small" style="justify-content:space-between"><span>${l}</span><b class="num">${inr(v)}</b></div>${prog(cost ? v / cost * 100 : 0)}</div>`).join('')}</div></div>
  <div class="card" style="margin-top:14px"><div class="card-h"><h3>Profit by event</h3><span class="tiny muted">Revenue uses invoices, or package value until invoiced</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Event</th><th class="r">Revenue</th><th class="r">Costs</th><th class="r">Profit</th><th class="r">Margin</th></tr></thead><tbody>${evs.map(({ e, m }) => `<tr onclick="A.go('event',{id:'${e.id}',tab:'money'})" style="cursor:pointer"><td><b>${esc(e.title)}</b><div class="tiny muted">${fmtShort(e.date)} · ${num(e.pax)} pax</div></td><td class="r">${inr(m.revenue)}</td><td class="r">${inr(m.cost)}</td><td class="r" style="color:${m.profit >= 0 ? 'var(--good)' : 'var(--bad)'}"><b>${inr(m.profit)}</b></td><td class="r">${m.revenue ? m.margin.toFixed(1) + '%' : '—'}</td></tr>`).join('') || `<tr><td colspan="5">${empty('No events in this period', '')}</td></tr>`}</tbody></table></div></div>`;
};
A.dl = name => { const p = S.filters.period || 'fy'; const [a, b] = periodRange(p); const evs = col('events').filter(e => e.date >= a && e.date <= b && e.stage !== 'Cancelled'); downloadFile(name, 'Event,Date,Client,Revenue,Costs,Profit,Margin %\n' + evs.map(e => { const m = eventMoney(e); return `"${e.title}",${e.date},"${e.client}",${Math.round(m.revenue)},${Math.round(m.cost)},${Math.round(m.profit)},${m.margin.toFixed(1)}`; }).join('\n'), 'text/csv'); };
function barChart(labels, s1, s2) {
  const W = 560, H = 220, pl = 52, pb = 26, pt = 10; const max = Math.max(1, ...s1, ...s2); const nice = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / nice) * nice;
  const y = v => pt + (H - pt - pb) * (1 - v / top); const gw = (W - pl) / labels.length; const bw = Math.min(26, gw / 3);
  const fmt = v => v >= 1e7 ? (v / 1e7).toFixed(1) + 'Cr' : v >= 1e5 ? (v / 1e5).toFixed(1) + 'L' : v >= 1e3 ? Math.round(v / 1e3) + 'k' : v;
  let g = ''; for (let k = 0; k <= 4; k++) { const v = top * k / 4; g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">₹${fmt(v)}</text>`; }
  labels.forEach((m, i) => { const x = pl + gw * i + gw / 2; g += `<rect x="${x - bw - 1}" y="${y(s1[i])}" width="${bw}" height="${H - pb - y(s1[i])}" rx="3" fill="var(--primary)"><title>Billed ${inr(s1[i])}</title></rect><rect x="${x + 1}" y="${y(s2[i])}" width="${bw}" height="${H - pb - y(s2[i])}" rx="3" fill="var(--accent)"><title>Costs ${inr(s2[i])}</title></rect><text x="${x}" y="${H - 8}" text-anchor="middle">${new Date(m + '-01T00:00').toLocaleDateString('en-IN', { month: 'short' })}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Billed vs costs, last six months">${g}</svg>`;
}

function seatingTool() {

  let tables, chairs, sofas; if (f.style === 'royal') { tables = Math.ceil(f.pax * .5 / 8); chairs = Math.ceil(f.pax * .85); sofas = Math.ceil(f.pax * .1 / 2); } else if (f.style === 'banquet') { tables = Math.ceil(f.pax / 8); chairs = f.pax; sofas = 10; } else { tables = 6; chairs = f.pax; sofas = 12; }
  const dens = f.pax ? f.area / f.pax : 0; const verdict = dens >= 20 ? ['Comfortable', 'good'] : dens >= 12 ? ['Tight but workable', 'warn'] : ['Too crowded', 'bad'];
  return `<div class="split"><div class="card pad stack"><div class="grid2" style="padding:0"><label class="field"><span>Guests</span><input type="number" min="1" value="${f.pax}" onchange="A.seat('pax',this.value)"></label><label class="field"><span>Area (sq ft)</span><input type="number" min="100" value="${f.area}" onchange="A.seat('area',this.value)"></label><label class="field full"><span>Setup style</span><select onchange="A.seat('style',this.value)"><option value="royal" ${f.style === 'royal' ? 'selected' : ''}>Wedding mix (50% dining, lounges)</option><option value="banquet" ${f.style === 'banquet' ? 'selected' : ''}>Full banquet (tables of 8)</option><option value="theatre" ${f.style === 'theatre' ? 'selected' : ''}>Theatre / conference rows</option></select></label></div>
  <div class="banner ${verdict[1]}">${ic('ruler')}<span><b>${dens.toFixed(1)} sq ft per guest</b> · ${verdict[0]}. Keep 20+ for weddings with buffet counters and a 6 ft fire exit corridor.</span></div></div>
  <div class="card pad stack"><h3>You need</h3><div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:0">${kpi('Round tables', tables)}${kpi('Chairs', chairs)}${kpi('VIP sofas', sofas)}</div>${can('inventory') ? `<div class="stack-sm small">${[['Round Table', tables], ['Chair', chairs], ['Sofa', sofas]].map(([k, n]) => { const it = col('inventory').find(i => i.name.toLowerCase().includes(k.toLowerCase())); return it ? `<div class="row-flex" style="justify-content:space-between"><span>${esc(it.name)}</span><span class="num">${num(n)} needed · ${num(availableOn(it, todayLocal()))} free today</span></div>` : ''; }).join('')}</div>` : ''}</div></div>`;
}
A.seat = (k, v) => { S.seat[k] = k === 'style' ? v : Math.max(1, +v || 1); render(); };
function truckTool() {
  const evs = col('events').filter(e => (e.items || []).length && !['Cancelled', 'Closed'].includes(e.stage)).sort(by('date'));
  const evId = S.filters.truckEv || evs[0]?.id; const e = evById(evId); const cap = +(S.filters.truckCap || 4000);
  const order = ['Tents & Shamiana', 'Power & DG', 'Decor & Flooring', 'Furniture', 'Catering Utensils', 'Lighting & Sound', 'Other'];
  const rows = (e?.items || []).map(it => ({ it, item: getById('inventory', it.invId) })).filter(x => x.item).map(x => ({ ...x, w: (+x.item.weightKg || 0) * x.it.qty })).sort((a, b) => order.indexOf(a.item.category) - order.indexOf(b.item.category));
  const total = sum(rows, r => r.w); const trips = Math.max(1, Math.ceil(total / cap)); const pct = Math.min(100, total / cap * 100);
  const msg = e ? `Loading list: ${e.title} → ${e.venue}\nTotal ~${num(total)} kg (${trips} trip${trips > 1 ? 's' : ''})\nLoad heavy first:\n` + rows.map((r, i) => `${i + 1}. ${r.item.name} × ${r.it.qty} (~${num(r.w)} kg)`).join('\n') : '';
  return `<div class="split"><div class="card pad stack"><label class="field"><span>Booking</span><select onchange="A.setF('truckEv',this.value)">${evs.map(x => `<option value="${x.id}" ${x.id === evId ? 'selected' : ''}>${esc(x.title)} (${fmtShort(x.date)})</option>`).join('') || '<option>No bookings with items</option>'}</select></label><label class="field"><span>Vehicle</span><select onchange="A.setF('truckCap',this.value)">${VEHICLES.map(([n, c]) => `<option value="${c}" ${c === cap ? 'selected' : ''}>${n} · ${num(c)} kg</option>`).join('')}</select></label>
  <div><div class="row-flex" style="justify-content:space-between"><b>Load</b><b class="num">${num(total)} / ${num(cap)} kg</b></div>${prog(pct)}<p class="small" style="margin-top:6px;color:${total > cap ? 'var(--bad)' : 'var(--good)'}">${total > cap ? `Over capacity: plan ${trips} trips or a bigger vehicle to avoid overloading fines.` : 'Within capacity for one trip.'}</p></div>${e ? waBtn(msg, '', 'Send to driver') : ''}</div>
  <div class="card"><div class="card-h"><h3>Loading order</h3><span class="tiny muted">Heavy base first, delicate lights last</span></div><div class="rows">${rows.map((r, i) => `<div class="row"><span class="pill ${i < 2 ? 'primary' : ''} num">${i + 1}</span><div class="main-col"><b>${esc(r.item.name)} × ${num(r.it.qty)}</b><div class="sub">${esc(r.item.category)}</div></div><span class="num small">${r.w ? '~' + num(r.w) + ' kg' : 'set weight in inventory'}</span></div>`).join('') || empty('Nothing to load', 'Reserve items in a booking first.')}</div></div></div>`;
}

A.uploadImg = (kind, file) => {
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Choose an image file (PNG or JPG)', 'bad'); return; }
  if (file.size > 5e6) { toast('This image is over 5 MB. Choose a smaller one.', 'bad'); return; }
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const max = kind === 'logo' ? 360 : 480; const w = img.naturalWidth || 300, h = img.naturalHeight || 300; const k = Math.min(1, max / Math.max(w, h));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/png'); if (url.length > 260000) url = c.toDataURL('image/jpeg', .85);
      try { await saveSettingsRec({ [kind]: url }); logAct(kind === 'logo' ? 'Updated business logo' : 'Updated stamp / signature'); toast(kind === 'logo' ? 'Logo saved. It now shows on all bills.' : 'Stamp saved'); render(); } catch (e) { toast(e.message, 'bad'); }
    };
    img.onerror = () => toast('Could not read this image. Try a PNG or JPG.', 'bad');
    img.src = r.result;
  };
  r.readAsDataURL(file);
};
A.removeImg = async kind => { try { await saveSettingsRec({ [kind]: '' }); render(); } catch (e) { toast(e.message, 'bad'); } };
A.setBrand = async c => { if (!/^#[0-9a-f]{6}$/i.test(c)) return; try { await saveSettingsRec({ brandColor: c }); render(); } catch (e) { toast(e.message, 'bad'); } };

  const m = S.members.find(x => x.userId === uidv); const rp = S.roles[m.role]?.perms || {}; const ov = m.perms || {};
  const roleOpts = Object.entries(S.roles).filter(([k]) => k !== 'owner').map(([k, r]) => [k, r.label]);
  const matrix = `<div class="eyebrow" style="margin:4px 0 8px">What ${esc((m.name || '').split(' ')[0])} can do</div><div class="tbl-wrap perm card" style="box-shadow:none"><table class="tbl"><thead><tr><th>Section</th><th>Access</th></tr></thead><tbody>${MODULES.map(md => `<tr><td><span class="row-flex" style="gap:8px;flex-wrap:nowrap">${ibox(md.icon, md.c, 'sm')}${esc(md.label)}</span></td><td><select name="p_${md.key}" class="${ov[md.key] != null ? 'ovr' : ''}">${[['', `Role default · ${LEVELS[+(rp[md.key] || 0)][1]}`], ...LEVELS.map(([v, l]) => [String(v), l])].map(([v, l]) => `<option value="${v}" ${String(ov[md.key] ?? '') === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><small class="muted">Change only what is different for this person. Everything else follows their role.</small>`;
  formModal({ title: m.name || displayId(m.email), sub: displayId(m.email), wide: true, fields: [
    { name: 'role', label: 'Role', type: 'select', options: roleOpts, value: m.role },
    { name: 'staffId', label: 'Link to crew record (for “My tasks”)', type: 'select', options: [['', '— Not linked —'], ...col('staff').map(s => [s.id, s.name])], value: m.staffId || '' },
    { name: 'pass', label: 'Set a new password (leave empty to keep)', type: 'text', full: true, autocomplete: 'new-password', hint: 'Use this when they forget their password. Then share it with them.' },
    { type: 'html', full: true, html: matrix }],
    left: `<button type="button" class="btn danger" onclick="A.removeMember('${uidv}')">${ic('trash')} Remove</button>${S.adapter.mode === 'cloud' ? `<button type="button" class="btn" onclick="A.resetMfa('${uidv}','${S.org.orgId}',${esc(JSON.stringify(m.name || ''))})">${ic('shield')} Reset authenticator</button>` : ''}`,
    onSubmit: async v => {
      need('team', 3); const perms = {};
      MODULES.forEach(md => { const x = v['p_' + md.key]; if (x !== '' && x != null) perms[md.key] = +x; });
      await S.adapter.updateMember(S.org.orgId, uidv, { staffId: v.staffId, perms, role: v.role });
      Object.assign(m, { staffId: v.staffId, perms: Object.keys(perms).length ? perms : null, role: v.role });
      if (v.pass) { if (v.pass.length < 6) throw new Error('Password needs 6+ characters'); await S.adapter.setPasswordFor(uidv, v.pass, S.org.orgId); setTimeout(() => credSheet('Password changed', m.name, m.email, v.pass), 60); }
      logAct(`Updated access for ${m.name}${Object.keys(perms).length ? ` (${Object.keys(perms).length} custom)` : ''}`); toast('Access updated'); render();
    } });
};
function accessSummary(m) {
  if (m.role === 'owner') return 'Full access to everything';
  const p = { ...(S.roles[m.role]?.perms || {}), ...(m.perms || {}) };
  const full = MODULES.filter(md => +p[md.key] >= 2).map(md => md.label.split(' ')[0]);
  const view = MODULES.filter(md => +p[md.key] === 1).length;
  return (full.length ? 'Can change: ' + full.slice(0, 4).join(', ') + (full.length > 4 ? ` +${full.length - 4}` : '') : 'View only') + (view ? ` · views ${view} more` : '');
}

/* ================= Login IDs & passwords ================= */
function genPass() { const w = ['Tent', 'Diya', 'Gulab', 'Kesar', 'Moti', 'Raja', 'Neem', 'Chand', 'Heera', 'Mehndi']; return w[Math.floor(Math.random() * w.length)] + '@' + (1000 + Math.floor(Math.random() * 9000)); }
function credSheet(title, name, email, pass) {
  const url = location.href.split('#')[0]; const id = displayId(email);
  const msg = `Namaste ${name || ''} ji!\n${S.org ? settings().bizName + ' ke ' : ''}${S.platform?.appName || 'EventPro'} app ka login:\n\nLink: ${url}\nLogin ID: ${id.replace('+91 ', '')}\nPassword: ${pass}\n\nKripya yeh password kisi aur ko na bataein.`;
  modal(`${sheetHead(title, name)}<div class="sheet-b stack">
    <div class="card pad stack-sm" style="background:var(--surface2);box-shadow:none"><div class="row-flex" style="justify-content:space-between"><span class="muted small">Link</span><span class="mono small" style="overflow-wrap:anywhere">${esc(url)}</span></div>
    <div class="row-flex" style="justify-content:space-between"><span class="muted small">Login ID</span><b class="mono">${esc(id.replace('+91 ', ''))}</b></div>
    <div class="row-flex" style="justify-content:space-between"><span class="muted small">Password</span><b class="mono">${esc(pass)}</b></div></div>
    <div class="banner warn">${ic('alert')}<span>Save or send this now. For safety the password is not shown again. You can always set a new one.</span></div>
    <div class="row-flex">${waBtn(msg, String(email).endsWith('@' + MOBILE_DOMAIN) ? email.split('@')[0] : '', 'Send on WhatsApp', 'btn wa')}<button class="btn" onclick="A.copy(${esc(JSON.stringify(msg))})">${ic('copy')} Copy</button></div></div>`);
}
A.memberForm = () => {
  const roleOpts = Object.entries(S.roles).filter(([k]) => k !== 'owner').map(([k, r]) => [k, r.label]);
  formModal({ title: 'Add employee', sub: 'Create their login. You decide what they can see and do.', fields: [
    { name: 'name', label: 'Full name', required: true, autofocus: true },
    { name: 'role', label: 'Role', type: 'select', options: roleOpts, value: 'staff' },
    { name: 'email', label: 'Login ID: mobile number or email', required: true, placeholder: '98290 12345', hint: 'They type this on the login screen' },
    { name: 'password', label: 'Password', type: 'text', required: true, value: genPass(), minlength: 6, hint: 'Change it if you like. Minimum 6 characters.' },
    { name: 'staffId', label: 'Link to crew record (for “My tasks”)', type: 'select', options: [['', '— Not linked —'], ...col('staff').map(s => [s.id, s.name])] },
    { type: 'html', full: true, html: `<div class="banner" style="font-size:13px">${ic('key')}<span>After adding, tap <b>Access</b> next to their name to give or remove access to any section.</span></div>` }],
    submit: 'Create login', onSubmit: async v => {
      need('team', 2); const email = loginId(v.email); if (!email.includes('@')) throw new Error('Enter a 10-digit mobile number or an email');
      if ((v.password || '').length < 6) throw new Error('Password must be at least 6 characters');
      const m = await S.adapter.createMember(S.org.orgId, { name: v.name, email, password: v.password, role: v.role, staffId: v.staffId });
      S.members.push(m); logAct(`Added ${v.name} as ${S.roles[v.role]?.label}`); render();
      setTimeout(() => credSheet('Login created', v.name, email, v.password), 60);
    } });
};
A.adminResetPw = userId => {
  const u = S.admin.users.find(x => x.userId === userId);
  formModal({ title: 'Reset password', sub: `${u.name} · ${displayId(u.email)}`, fields: [{ name: 'password', label: 'New password', type: 'text', required: true, value: genPass(), full: true, hint: 'Share it with them on WhatsApp after saving.' }],
    submit: 'Set password', onSubmit: async v => { if ((v.password || '').length < 6) throw new Error('Password must be at least 6 characters'); await S.adapter.setPasswordFor(userId, v.password, null); setTimeout(() => credSheet('Password reset', u.name, u.email, v.password), 60); } });
};
A.adminBlock = (userId, block) => {
  const u = S.admin.users.find(x => x.userId === userId);
  confirmBox(block ? 'Block this login?' : 'Unblock this login?', block ? `${u.name} (${displayId(u.email)}) will not be able to log in until you unblock. Their data stays.` : `${u.name} will be able to log in again.`, block ? 'Block login' : 'Unblock', async () => { await S.adapter.adminBlockUser(userId, block); await A.adminLoad(); toast(block ? 'Login blocked' : 'Login unblocked'); }, block ? 'danger' : 'primary');
};
A.adminAddBusiness = () => {
  const P = S.platform || DEFAULT_PLATFORM;
  formModal({ title: 'Add a business', sub: 'Creates the business and its owner login.', fields: [
    { name: 'bizName', label: 'Business name', required: true, full: true, autofocus: true },
    { name: 'name', label: 'Owner name', required: true }, { name: 'phone', label: 'Owner mobile', type: 'tel' },
    { name: 'email', label: 'Owner login ID: mobile or email', required: true }, { name: 'password', label: 'Owner password', type: 'text', required: true, value: genPass() },
    { name: 'city', label: 'City', value: 'Jaipur' },
    { name: 'plan', label: 'Plan', type: 'select', options: ['Trial', ...P.plans.map(p => p.name)].map(n => [n, n === 'Trial' ? 'Free trial' : `${n} · ${inr(planPrice(n))}/month`]) },
    { name: 'expires', label: 'Valid till', type: 'date', value: addDays(todayLocal(), +P.trialDays || 14) },
    ...BIZ_TYPES.map(([k, l]) => ({ name: 't_' + k, label: l, type: 'checkbox', value: true }))],
    submit: 'Create business', onSubmit: async v => {
      const email = loginId(v.email); if (!email.includes('@')) throw new Error('Enter a 10-digit mobile number or an email');
      const types = BIZ_TYPES.map(([k]) => k).filter(k => v['t_' + k]);
      const st = Object.assign(defaultSettings({ bizName: v.bizName, owner: v.name, phone: v.phone, email: email.endsWith('@' + MOBILE_DOMAIN) ? '' : email, bizTypes: types.length ? types : ['tent', 'caterer', 'event'] }), { city: v.city });
      await S.adapter.adminCreateBusiness({ email, password: v.password, name: v.name, phone: v.phone, bizName: v.bizName, roles: ROLE_DEFAULTS, settings: st, plan: v.plan, status: v.plan === 'Trial' ? 'trial' : 'active', expires: v.expires });
      await A.adminLoad(); setTimeout(() => credSheet('Business created', v.name, email, v.password), 60);
    } });
};

boot();

</script>
